\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A 60 puedes volver a por todo lo que te saltaste si lo necesitas para PvP o para raid.\u003c/p>\n\u003cp>Entrenadores de cazador de la Horda:\u003c/p>\n\u003cul>\u003cli>Durotar: Jen'shan (Valley of Trials) y Thotar (Razor Hill).\u003c/li>\u003cli>Orgrimmar: Valley of Honor.\u003c/li>\u003cli>Thunder Bluff: Hunter's Rise.\u003c/li>\u003cli>Stranglethorn Vale: Kragg (Grom'gol).\u003c/li>\u003c/ul>\n\u003cp>Fuentes:\u003c/p>\n\u003cul>\u003cli>Method, hechizos de cazador: \u003ca class=\"ext\" href=\"https://www.method.gg/wow-forever/all-class-spells/hunter\" target=\"_blank\" rel=\"noopener\">method.gg\u003c/a>\u003c/li>\u003cli>Warcraft Tavern, entrenadores de clase: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/class-trainers/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003c/ul>","sections":[]},"mascotas":{"title":"Mascotas","intro":"","sections":[{"title":"Plan de mascotas","titleHtml":"Plan de mascotas","slug":"plan-de-mascotas","html":"\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nivel\u003c/th>\u003cth>Mascota\u003c/th>\u003cth>Dónde\u003c/th>\u003cth>Por qué\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>\u003cstrong>Shal'ma\u003c/strong> (Cat, nivel 9, ataque cada 1,3 s)\u003c/td>\u003ctd>Durotar, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way 61.0 88.2\" title=\"Copiar para TomTom\">61.0 88.2\u003c/button> o \u003ccode>68.4 70.6\u003c/code>\u003c/td>\u003ctd>El mejor gato de Durotar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10 (alternativa)\u003c/td>\u003ctd>Raluk (Cat, nivel 7)\u003c/td>\u003ctd>Durotar, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way 68.4 71.4\" title=\"Copiar para TomTom\">68.4 71.4\u003c/button>\u003c/td>\u003ctd>Por si Shal'ma no aparece\u003c/td>\u003c/tr>\u003ctr>\u003ctd>23+ (opcional)\u003c/td>\u003ctd>Humar the Pridelord (Cat, rare elite 23, 1,3 s)\u003c/td>\u003ctd>The Barrens, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way 62.0 33.4\" title=\"Copiar para TomTom\">62.0 33.4\u003c/button>\u003c/td>\u003ctd>Solo si pasas cerca. No merece la pena buscarlo a propósito\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>37\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Broken Tooth\u003c/strong> (Cat 37, \u003cstrong>1,0 s\u003c/strong>, Dash 1)\u003c/td>\u003ctd>Badlands, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way 52.8 28.4\" title=\"Copiar para TomTom\">52.8 28.4\u003c/button> o \u003ccode>25.8 48.6\u003c/code> (reaparece cada 7-8 h)\u003c/td>\u003ctd>El gato más rápido del leveo y la mejor mascota de PvP. \u003cstrong>Quédatelo hasta 60\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>57+ (opcional)\u003c/td>\u003ctd>Ta'shkal (Cat, 0,85 s)\u003c/td>\u003ctd>Es invocado, no tiene tiempo de reaparición. Guía: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/how-to-tame-tashkal-the-corrupted-cat/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/td>\u003ctd>El más rápido del juego\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Otras opciones:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Lobo\u003c/strong>: Mist Howler (Wolf 22, Furious Howl) en Ashenvale, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way 26.8 18.4\" title=\"Copiar para TomTom\">26.8 18.4\u003c/button>. Es mejor en grupo.\u003c/li>\u003cli>\u003cstrong>Jabalí (Boar)\u003c/strong>: aguanta más y tiene Charge. Sirve como tanque si el gato se muere mucho.\u003c/li>\u003c/ul>","text":"Nivel Mascota Dónde Por qué Shal'ma (Cat, nivel 9, ataque cada 1,3 s) Durotar, /way 61.0 88.2 o 68.4 70.6 El mejor gato de Durotar (alternativa) Raluk (Cat, nivel 7) Durotar, /way 68.4 71.4 Por si Shal'ma no aparece + (opcional) Humar the Pridelord (Cat, rare elite 23, 1,3 s) The Barrens, /way 62.0 33.4 Solo si pasas cerca. No merece la pena buscarlo a propósito Broken Tooth (Cat 37, 1,0 s, Dash 1) Badlands, /way 52.8 28.4 o 25.8 48.6 (reaparece cada 7-8 h) El gato más rápido del leveo y la mejor mascota de PvP. Quédatelo hasta 60 + (opcional) Ta'shkal (Cat, 0,85 s) Es invocado, no tiene tiempo de reaparición. Guía: https://www.warcrafttavern.com/forever/guides/how-to-tame-tashkal-the-corrupted-cat/ El más rápido del juego Otras opciones: Lobo: Mist Howler (Wolf 22, Furious Howl) en Ashenvale, /way 26.8 18.4. Es mejor en grupo. Jabalí (Boar): aguanta más y tiene Charge. Sirve como tanque si el gato se muere mucho.","range":null},{"title":"Domar","titleHtml":"Domar","slug":"domar","html":"\u003cul>\u003cli>\u003cstrong>Misión de clase a nivel 10:\u003c/strong> &quot;Taming the Beast&quot; con Thotar en Razor Hill. Doma tres bestias de práctica (Dire Mottled Boar, Surf Crawler, Armored Scorpid) y termina con &quot;Training the Beast&quot; con Ormak Grimshot en Orgrimmar. Así aprendes Tame Beast, Beast Training, Feed Pet y Revive Pet.\u003c/li>\u003cli>Solo puedes domar bestias de \u003cstrong>tu nivel o inferior\u003c/strong>.\u003c/li>\u003cli>No puedes domar si tienes una mascota activa, aunque esté retirada (dismissed). Mételas en el establo o abandónalas.\u003c/li>\u003cli>Mientras canalizas Tame Beast tu armadura baja un 100 %. Ponte Aspect of the Monkey y usa Freezing Trap o Concussive Shot si hace falta.\u003c/li>\u003cli>El establo tiene 3 mascotas (1 activa y 2 guardadas). Se pueden comprar 2 huecos más.\u003c/li>\u003c/ul>","text":"Misión de clase a nivel 10: \"Taming the Beast\" con Thotar en Razor Hill. Doma tres bestias de práctica (Dire Mottled Boar, Surf Crawler, Armored Scorpid) y termina con \"Training the Beast\" con Ormak Grimshot en Orgrimmar. Así aprendes Tame Beast, Beast Training, Feed Pet y Revive Pet. Solo puedes domar bestias de tu nivel o inferior. No puedes domar si tienes una mascota activa, aunque esté retirada (dismissed). Mételas en el establo o abandónalas. Mientras canalizas Tame Beast tu armadura baja un 100 %. Ponte Aspect of the Monkey y usa Freezing Trap o Concussive Shot si hace falta. El establo tiene 3 mascotas (1 activa y 2 guardadas). Se pueden comprar 2 huecos más.","range":null},{"title":"Habilidades (Beast Training)","titleHtml":"Habilidades (Beast Training)","slug":"habilidades-beast-training","html":"\u003cp>Cómo enseñar una habilidad a tu mascota:\u003c/p>\n\u003col>\u003cli>Guarda tu mascota en el establo.\u003c/li>\u003cli>Doma una bestia que ya tenga la habilidad.\u003c/li>\u003cli>Úsala en combate hasta que salga el mensaje de que la has aprendido.\u003c/li>\u003cli>Guarda o abandona la bestia temporal.\u003c/li>\u003cli>Enséñasela a tu mascota con Beast Training.\u003c/li>\u003c/ol>\n\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Habilidad\u003c/th>\u003cth>Dónde aprenderla\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Claw 1\u003c/td>\u003ctd>Scorpid Worker, Valley of Trials (nivel 3, unos \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Durotar 41.4 63.4\" title=\"Copiar para TomTom\">Durotar 41.4 63.4\u003c/button>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Claw 2\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Venomtail Scorpid\u003c/strong>, noroeste de Durotar (nivel 9-10, unos \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Durotar 36.8 27.0\" title=\"Copiar para TomTom\">Durotar 36.8 27.0\u003c/button>). Enséñasela a Shal'ma nada más domarla\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Claw 3\u003c/td>\u003ctd>Black Bear Patriarch, Loch Modan (16-17)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bite 2\u003c/td>\u003ctd>Prairie Wolf Alpha, Coyote, Worg, Daggerfang, Oasis Snapjaw, entre otros (según un comentario en Warcraft Tavern)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dash 1\u003c/td>\u003ctd>Stranglethorn Tiger (no los Young), nivel 32-33. Broken Tooth ya viene con Dash 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Dive 1\u003c/td>\u003ctd>Kraul Bat, Razorfen Kraul (30-31)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Furious Howl 1\u003c/td>\u003ctd>Mist Howler (Ashenvale)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>\u003cstrong>Prioridad para un gato:\u003c/strong> Claw (al máximo rango posible) &gt; Dash &gt; Growl. Bite es casi innecesario: con autocast la mascota prioriza Claw.\u003c/li>\u003cli>\u003cstrong>En el entrenador de mascotas:\u003c/strong> Growl (se desbloquea un rango cada 10 niveles), Great Stamina, Natural Armor y resistencias. Pon \u003cstrong>Growl y Great Stamina\u003c/strong> al día.\u003c/li>\u003cli>Una mascota puede tener como máximo \u003cstrong>4 habilidades activas\u003c/strong>.\u003c/li>\u003cli>Lealtad: Rebellious → Unruly → Submissive → Dependable → Faithful → Best Friend. Sube al darle de comer y al matar. Con Best Friend a 60 tiene 300 Training Points.\u003c/li>\u003c/ul>","text":"Cómo enseñar una habilidad a tu mascota: Guarda tu mascota en el establo. Doma una bestia que ya tenga la habilidad. Úsala en combate hasta que salga el mensaje de que la has aprendido. Guarda o abandona la bestia temporal. Enséñasela a tu mascota con Beast Training. Habilidad Dónde aprenderla Claw 1 Scorpid Worker, Valley of Trials (nivel 3, unos /way Durotar 41.4 63.4) Claw 2 Venomtail Scorpid, noroeste de Durotar (nivel 9-10, unos /way Durotar 36.8 27.0). Enséñasela a Shal'ma nada más domarla Claw 3 Black Bear Patriarch, Loch Modan (16-17) Bite 2 Prairie Wolf Alpha, Coyote, Worg, Daggerfang, Oasis Snapjaw, entre otros (según un comentario en Warcraft Tavern) Dash 1 Stranglethorn Tiger (no los Young), nivel 32-33. Broken Tooth ya viene con Dash 1 Dive 1 Kraul Bat, Razorfen Kraul (30-31) Furious Howl 1 Mist Howler (Ashenvale) Prioridad para un gato: Claw (al máximo rango posible) > Dash > Growl. Bite es casi innecesario: con autocast la mascota prioriza Claw. En el entrenador de mascotas: Growl (se desbloquea un rango cada 10 niveles), Great Stamina, Natural Armor y resistencias. Pon Growl y Great Stamina al día. Una mascota puede tener como máximo 4 habilidades activas. Lealtad: Rebellious → Unruly → Submissive → Dependable → Faithful → Best Friend. Sube al darle de comer y al matar. Con Best Friend a 60 tiene 300 Training Points.","range":null},{"title":"Felicidad y comida","titleHtml":"Felicidad y comida","slug":"felicidad-y-comida","html":"\u003cul>\u003cli>Happy = 125 % de daño. Content = 100 %. Unhappy = 75 %. \u003cstrong>Mantenla siempre Happy.\u003c/strong>\u003c/li>\u003cli>Dale de comer fuera de combate. Morir le quita mucha felicidad, y Dismiss Pet le quita 50.\u003c/li>\u003cli>Lleva siempre comida que le guste. El \u003cstrong>gato come Meat y Fish\u003c/strong>: la carne que sueltan las bestias sirve.\u003c/li>\u003cli>En la beta la felicidad solo bajaba al morir la mascota. Puede que lo hayan arreglado.\u003c/li>\u003c/ul>","text":"Happy = 125 % de daño. Content = 100 %. Unhappy = 75 %. Mantenla siempre Happy. Dale de comer fuera de combate. Morir le quita mucha felicidad, y Dismiss Pet le quita 50. Lleva siempre comida que le guste. El gato come Meat y Fish: la carne que sueltan las bestias sirve. En la beta la felicidad solo bajaba al morir la mascota. Puede que lo hayan arreglado.","range":null},{"title":"Cómo escala","titleHtml":"Cómo escala","slug":"como-escala","html":"\u003cul>\u003cli>Tu mascota recibe el \u003cstrong>10 % de tu Attack Power\u003c/strong> y el \u003cstrong>100 % de tu Critical Strike\u003c/strong>.\u003c/li>\u003cli>Gana el 25 % de la experiencia que ganas tú. Nunca supera tu nivel.\u003c/li>\u003cli>Si la invocas sentada junto al campamento, recibe los buffs de Camping.\u003c/li>\u003c/ul>","text":"Tu mascota recibe el 10 % de tu Attack Power y el 100 % de tu Critical Strike. Gana el 25 % de la experiencia que ganas tú. Nunca supera tu nivel. Si la invocas sentada junto al campamento, recibe los buffs de Camping.","range":null},{"title":"Familias (dieta)","titleHtml":"Familias (dieta)","slug":"familias-dieta","html":"\u003cul>\u003cli>\u003cstrong>Offensive:\u003c/strong> Cat (Meat, Fish), Bat, Bird of Prey, Raptor, Spider, Wind Serpent, Fox y Core Hound.\u003c/li>\u003cli>\u003cstrong>Balanced:\u003c/strong> Wolf (Meat), Hyena y Carrion Bird.\u003c/li>\u003cli>\u003cstrong>Defensive:\u003c/strong> Boar (come de todo), Bear (come de todo), Crab, Crocolisk, Gorilla, Scorpid, Tallstrider y Turtle.\u003c/li>\u003cli>\u003cstrong>PvP organizado:\u003c/strong> Crocolisk (Dismember, reduce la curación), Bat (Sonic Blast) y Bird of Prey (Mine!, desarma).\u003c/li>\u003c/ul>\n\u003cp>Fuentes:\u003c/p>\n\u003cul>\u003cli>Warcraft Tavern, mascotas: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/hunter-pets/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Warcraft Tavern, mejores mascotas: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/best-hunter-pets/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Warcraft Tavern, familias: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/hunter-pet-families/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>guided.news, bestias por zona: \u003ca class=\"ext\" href=\"https://guided.news/en/guides/wow-forever-tame-train-hunter-pets-rare-beasts/\" target=\"_blank\" rel=\"noopener\">guided.news\u003c/a>\u003c/li>\u003c/ul>","text":"Offensive: Cat (Meat, Fish), Bat, Bird of Prey, Raptor, Spider, Wind Serpent, Fox y Core Hound. Balanced: Wolf (Meat), Hyena y Carrion Bird. Defensive: Boar (come de todo), Bear (come de todo), Crab, Crocolisk, Gorilla, Scorpid, Tallstrider y Turtle. PvP organizado: Crocolisk (Dismember, reduce la curación), Bat (Sonic Blast) y Bird of Prey (Mine!, desarma). Fuentes: Warcraft Tavern, mascotas: https://www.warcrafttavern.com/forever/guides/hunter-pets/ Warcraft Tavern, mejores mascotas: https://www.warcrafttavern.com/forever/guides/best-hunter-pets/ Warcraft Tavern, familias: https://www.warcrafttavern.com/forever/guides/hunter-pet-families/ guided.news, bestias por zona: https://guided.news/en/guides/wow-forever-tame-train-hunter-pets-rare-beasts/","range":null}]},"armas":{"title":"Armas y equipo","intro":"","sections":[{"title":"Prioridad de estadísticas mientras subes","titleHtml":"Prioridad de estadísticas mientras subes","slug":"prioridad-de-estadisticas-mientras-subes","html":"\u003cp>\u003cstrong>Daño del arma a distancia\u003c/strong> &gt; Agility &gt; Attack Power &gt; Intellect &gt; Stamina.\u003c/p>\n\u003cp>No persigas el tope de Hit mientras subes. En Forever, Weapon Skill se sustituye por Expertise; para jefes, el tope de Hit es del 9 %.\u003c/p>","text":"Daño del arma a distancia > Agility > Attack Power > Intellect > Stamina. No persigas el tope de Hit mientras subes. En Forever, Weapon Skill se sustituye por Expertise; para jefes, el tope de Hit es del 9 %.","range":null},{"title":"Arma a distancia por nivel (Horda)","titleHtml":"Arma a distancia por nivel (Horda)","slug":"arma-a-distancia-por-nivel-horda","html":"\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nivel\u003c/th>\u003cth>Arma\u003c/th>\u003cth>Cómo se consigue\u003c/th>\u003cth>¿Ir a por ella?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1-12\u003c/td>\u003ctd>La inicial y mejoras de vendedor\u003c/td>\u003ctd>Vendedor de armas\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>13\u003c/td>\u003ctd>Barbaric Crossbow\u003c/td>\u003ctd>Ragefire Chasm (Orgrimmar)\u003c/td>\u003ctd>Solo si haces Ragefire Chasm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>19\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Venomstrike\u003c/strong> (arco)\u003c/td>\u003ctd>Lord Serpentis, \u003cstrong>Wailing Caverns\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Sí\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>~20-25\u003c/td>\u003ctd>Precision Bow o Moonsight Rifle\u003c/td>\u003ctd>Misión &quot;Scramble&quot; (Cozy Sleeping Bag, Stonetalon). Da también 200 Feathered Arrow\u003c/td>\u003ctd>Sí, va con la cadena\u003c/td>\u003c/tr>\u003ctr>\u003ctd>22-23\u003c/td>\u003ctd>Naga Heartpiercer / Fallenroot Longbow\u003c/td>\u003ctd>Blackfathom Deeps\u003c/td>\u003ctd>Solo si haces Blackfathom Deeps\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>29\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Quilboar Blaster\u003c/strong> (rifle)\u003c/td>\u003ctd>Misión Vengeful Fate, \u003cstrong>Razorfen Kraul\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Sí\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>34\u003c/td>\u003ctd>Spellsever Crossbow\u003c/td>\u003ctd>Scarlet Monastery: Library\u003c/td>\u003ctd>Opcional\u003c/td>\u003c/tr>\u003ctr>\u003ctd>35\u003c/td>\u003ctd>Frosty Blunderbuss\u003c/td>\u003ctd>The Drowned City (Stranglethorn)\u003c/td>\u003ctd>Opcional\u003c/td>\u003c/tr>\u003ctr>\u003ctd>~35-39\u003c/td>\u003ctd>Sidegunner Shottie / Blasting Hackbut / Bow of Plunder\u003c/td>\u003ctd>Misiones: Gizelton Caravan (Desolace), Questioning Reethe (Dustwallow), Dangerous! (Hillsbrad)\u003c/td>\u003ctd>La que te pille de camino\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>40\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Truthseeker's Bow\u003c/strong>\u003c/td>\u003ctd>Entrega \u003cstrong>25 libros de biblioteca\u003c/strong> en la biblioteca de tu facción\u003c/td>\u003ctd>\u003cstrong>Sí\u003c/strong>. Ve recogiendo libros desde el principio\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>41-43\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Master Hunter's Bow / Rifle\u003c/strong>\u003c/td>\u003ctd>Big Game Hunter (King Bangalash, Stranglethorn); empieza con Welcome to the Jungle\u003c/td>\u003ctd>\u003cstrong>Sí\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>42\u003c/td>\u003ctd>Arch of the Covenant / Galgann's Fireblaster\u003c/td>\u003ctd>Zul'Farrak / Uldaman\u003c/td>\u003ctd>Arch of the Covenant sí (Zul'Farrak está en la ruta)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>45\u003c/td>\u003ctd>Verdant Keeper's Aim\u003c/td>\u003ctd>Misión Corruption of Earth and Seed (Maraudon)\u003c/td>\u003ctd>\u003cstrong>Sí\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>47 / 50\u003c/td>\u003ctd>Thorium Rifle / Dark Iron Rifle\u003c/td>\u003ctd>Engineering, BoE. Se compran en la subasta\u003c/td>\u003ctd>Si está barato\u003c/td>\u003c/tr>\u003ctr>\u003ctd>48\u003c/td>\u003ctd>Megashot Rifle\u003c/td>\u003ctd>Maraudon\u003c/td>\u003ctd>Si cae\u003c/td>\u003c/tr>\u003ctr>\u003ctd>~55\u003c/td>\u003ctd>Gorewood Bow\u003c/td>\u003ctd>The Scarlet Oracle, Demetria (Eastern Plaguelands, grupo)\u003c/td>\u003ctd>Sí, si hay grupo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>54+\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Blackcrow\u003c/strong>\u003c/td>\u003ctd>Shadow Hunter Vosh'gajin, \u003cstrong>Lower Blackrock Spire\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Sí\u003c/strong>. La mejor antes de raid\u003c/td>\u003c/tr>\u003ctr>\u003ctd>56 / 58\u003c/td>\u003ctd>Carapace Spine Crossbow / Deep Jungle Rifle\u003c/td>\u003ctd>Stratholme (lado Undead) / Shaper's Terrace\u003c/td>\u003ctd>A 60\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Antes de equipar un tipo nuevo (arcos, rifles o ballestas), \u003cstrong>aprende la habilidad en el entrenador de armas\u003c/strong>. En Orgrimmar, Hanashi y Sayoc enseñan arcos; en Undercity, Archibald enseña ballestas.\u003c/p>","text":"Nivel Arma Cómo se consigue ¿Ir a por ella? La inicial y mejoras de vendedor Vendedor de armas Sí Barbaric Crossbow Ragefire Chasm (Orgrimmar) Solo si haces Ragefire Chasm Venomstrike (arco) Lord Serpentis, Wailing Caverns Sí ~20-25 Precision Bow o Moonsight Rifle Misión \"Scramble\" (Cozy Sleeping Bag, Stonetalon). Da también 200 Feathered Arrow Sí, va con la cadena Naga Heartpiercer / Fallenroot Longbow Blackfathom Deeps Solo si haces Blackfathom Deeps Quilboar Blaster (rifle) Misión Vengeful Fate, Razorfen Kraul Sí Spellsever Crossbow Scarlet Monastery: Library Opcional Frosty Blunderbuss The Drowned City (Stranglethorn) Opcional ~35-39 Sidegunner Shottie / Blasting Hackbut / Bow of Plunder Misiones: Gizelton Caravan (Desolace), Questioning Reethe (Dustwallow), Dangerous! (Hillsbrad) La que te pille de camino Truthseeker's Bow Entrega 25 libros de biblioteca en la biblioteca de tu facción Sí. Ve recogiendo libros desde el principio Master Hunter's Bow / Rifle Big Game Hunter (King Bangalash, Stranglethorn); empieza con Welcome to the Jungle Sí Arch of the Covenant / Galgann's Fireblaster Zul'Farrak / Uldaman Arch of the Covenant sí (Zul'Farrak está en la ruta) Verdant Keeper's Aim Misión Corruption of Earth and Seed (Maraudon) Sí / 50 Thorium Rifle / Dark Iron Rifle Engineering, BoE. Se compran en la subasta Si está barato Megashot Rifle Maraudon Si cae ~55 Gorewood Bow The Scarlet Oracle, Demetria (Eastern Plaguelands, grupo) Sí, si hay grupo + Blackcrow Shadow Hunter Vosh'gajin, Lower Blackrock Spire Sí. La mejor antes de raid / 58 Carapace Spine Crossbow / Deep Jungle Rifle Stratholme (lado Undead) / Shaper's Terrace A 60 Antes de equipar un tipo nuevo (arcos, rifles o ballestas), aprende la habilidad en el entrenador de armas. En Orgrimmar, Hanashi y Sayoc enseñan arcos; en Undercity, Archibald enseña ballestas.","range":null},{"title":"Libros de biblioteca","titleHtml":"Libros de biblioteca","slug":"libros-de-biblioteca","html":"\u003cp>En Forever, la biblioteca está abierta a todas las clases. Se entregan 10, 20, 25 y 35 libros para conseguir recompensas; con 25 se consigue \u003cstrong>Truthseeker's Bow\u003c/strong>. \u003cstrong>Coge todos los libros que encuentres.\u003c/strong> La cadena de Cozy Sleeping Bag pasa junto a varios.\u003c/p>","text":"En Forever, la biblioteca está abierta a todas las clases. Se entregan 10, 20, 25 y 35 libros para conseguir recompensas; con 25 se consigue Truthseeker's Bow. Coge todos los libros que encuentres. La cadena de Cozy Sleeping Bag pasa junto a varios.","range":null},{"title":"Armadura (cuero y malla a partir de 40)","titleHtml":"Armadura (cuero y malla a partir de 40)","slug":"armadura-cuero-y-malla-a-partir-de-40","html":"\u003cul>\u003cli>\u003cstrong>Leatherworking\u003c/strong> fabrica equipo de leveo azul con Agility desde nivel 10. En Forever es BoP, es decir, solo para ti. Ver \u003ca href=\"#profesiones\">profesiones.md\u003c/a>.\u003c/li>\u003cli>Piezas destacadas del leveo:\u003cul>\u003cli>Wailing Caverns: set &quot;of the Fang&quot; (Leggings, Footpads, Belt).\u003c/li>\u003cli>Ashenvale: Wildhunter Cloak (The Hunt Completed).\u003c/li>\u003cli>Feralas: Jangdor's Handcrafted Tunic (Improved Quality).\u003c/li>\u003cli>Stranglethorn: Tiger Hunter Gloves, Panther Hunter Leggings y Raptor Hunter Tunic (cadenas de Nesingwary).\u003c/li>\u003cli>Leatherworking: Dark Leather Boots, Brawler's Leather Hood y Stalker's Leather Belt.\u003c/li>\u003cli>Mazmorras: Bloodied Chestwraps y Triprunner Dungarees.\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>","text":"Leatherworking fabrica equipo de leveo azul con Agility desde nivel 10. En Forever es BoP, es decir, solo para ti. Ver profesiones.md. Piezas destacadas del leveo: Wailing Caverns: set \"of the Fang\" (Leggings, Footpads, Belt). Ashenvale: Wildhunter Cloak (The Hunt Completed). Feralas: Jangdor's Handcrafted Tunic (Improved Quality). Stranglethorn: Tiger Hunter Gloves, Panther Hunter Leggings y Raptor Hunter Tunic (cadenas de Nesingwary). Leatherworking: Dark Leather Boots, Brawler's Leather Hood y Stalker's Leather Belt. Mazmorras: Bloodied Chestwraps y Triprunner Dungarees.","range":null},{"title":"Encantamientos y consumibles a 60","titleHtml":"Encantamientos y consumibles a 60","slug":"encantamientos-y-consumibles-a-60","html":"\u003cp>Sniper Scope (Engineering), Enchant Chest - Greater Stats, Enchant Boots - Minor Speed, Elixir of the Mongoose y Grilled Squid.\u003c/p>\n\u003cp>Fuentes:\u003c/p>\n\u003cul>\u003cli>Warcraft Tavern, leveo de cazador: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/hunter-leveling/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Method: \u003ca class=\"ext\" href=\"https://www.method.gg/wow-forever/wow-forever-hunter-leveling-guide-and-talents\" target=\"_blank\" rel=\"noopener\">method.gg\u003c/a>\u003c/li>\u003cli>wow.gg Beast Mastery: \u003ca class=\"ext\" href=\"https://wow.gg/guides/wow-forever-beast-mastery-hunter\" target=\"_blank\" rel=\"noopener\">wow.gg\u003c/a>\u003c/li>\u003cli>games.gg, guías de zona (ver \u003ca href=\"#fuentes\">fuentes.md\u003c/a>)\u003c/li>\u003c/ul>","text":"Sniper Scope (Engineering), Enchant Chest - Greater Stats, Enchant Boots - Minor Speed, Elixir of the Mongoose y Grilled Squid. Fuentes: Warcraft Tavern, leveo de cazador: https://www.warcrafttavern.com/forever/guides/hunter-leveling/ Method: https://www.method.gg/wow-forever/wow-forever-hunter-leveling-guide-and-talents wow.gg Beast Mastery: https://wow.gg/guides/wow-forever-beast-mastery-hunter games.gg, guías de zona (ver fuentes.md)","range":null}]},"mecanicas":{"title":"Mecánicas del cazador","intro":"","sections":[{"title":"Rotación al subir de nivel","titleHtml":"Rotación al subir de nivel","slug":"rotacion-al-subir-de-nivel","html":"\u003cp>\u003cstrong>Antes de nivel 10 (sin mascota):\u003c/strong>\u003c/p>\n\u003col>\u003cli>Aspect of the Monkey.\u003c/li>\u003cli>Abre con Auto Shot desde la máxima distancia.\u003c/li>\u003cli>Serpent Sting → Arcane Shot → Concussive Shot (desde 8).\u003c/li>\u003cli>Aléjate entre disparos (kiting). Usa Raptor Strike solo si te alcanzan.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Desde 10 (Beast Mastery):\u003c/strong>\u003c/p>\n\u003col>\u003cli>Aspect of the Hawk.\u003c/li>\u003cli>Manda la mascota y \u003cstrong>deja que pegue un par de golpes\u003c/strong> antes de disparar, para que no se te giren los enemigos.\u003c/li>\u003cli>Auto Shot + Serpent Sting (solo en enemigos que duren) → Aimed Shot y Multi-Shot (comparten tiempo de reutilización) → Arcane Shot.\u003c/li>\u003cli>\u003cstrong>Desde 25:\u003c/strong> mantén siempre dos Summon Hawk fuera. Arcane Shot comparte 6 s de reutilización con Summon Hawk, así que úsalo poco.\u003c/li>\u003cli>\u003cstrong>Desde 40:\u003c/strong> Bestial Wrath y Rapid Fire en peleas largas o en PvP.\u003c/li>\u003cli>Si la mascota pierde la amenaza (aggro): Wing Clip, Concussive Shot o Frost Trap, y aléjate.\u003c/li>\u003cli>Usa Mend Pet contra elites y Feign Death (desde 30) para salir de combate.\u003c/li>\u003c/ol>","text":"Antes de nivel 10 (sin mascota): Aspect of the Monkey. Abre con Auto Shot desde la máxima distancia. Serpent Sting → Arcane Shot → Concussive Shot (desde 8). Aléjate entre disparos (kiting). Usa Raptor Strike solo si te alcanzan. Desde 10 (Beast Mastery): Aspect of the Hawk. Manda la mascota y deja que pegue un par de golpes antes de disparar, para que no se te giren los enemigos. Auto Shot + Serpent Sting (solo en enemigos que duren) → Aimed Shot y Multi-Shot (comparten tiempo de reutilización) → Arcane Shot. Desde 25: mantén siempre dos Summon Hawk fuera. Arcane Shot comparte 6 s de reutilización con Summon Hawk, así que úsalo poco. Desde 40: Bestial Wrath y Rapid Fire en peleas largas o en PvP. Si la mascota pierde la amenaza (aggro): Wing Clip, Concussive Shot o Frost Trap, y aléjate. Usa Mend Pet contra elites y Feign Death (desde 30) para salir de combate.","range":null},{"title":"Zona muerta","titleHtml":"Zona muerta","slug":"zona-muerta","html":"\u003cul>\u003cli>Entre el cuerpo a cuerpo y unas \u003cstrong>8 yardas\u003c/strong> no puedes disparar.\u003c/li>\u003cli>Sal de ella con Wing Clip, Disengage o Frost Trap, y aléjate andando.\u003c/li>\u003c/ul>","text":"Entre el cuerpo a cuerpo y unas 8 yardas no puedes disparar. Sal de ella con Wing Clip, Disengage o Frost Trap, y aléjate andando.","range":null},{"title":"Cambios de Forever que te afectan","titleHtml":"Cambios de Forever que te afectan","slug":"cambios-de-forever-que-te-afectan","html":"\u003cul>\u003cli>\u003cstrong>Auto Shot\u003c/strong> necesita que estés \u003cstrong>quieto 0,5 s\u003c/strong> para empezar.\u003c/li>\u003cli>\u003cstrong>Todas las trampas comparten un tiempo de reutilización de 30 s\u003c/strong> y se pueden usar en combate.\u003c/li>\u003cli>Mejoras al lanzamiento: Aimed Shot hace un 110 % más de daño extra, Arcane Shot un 30 % más de daño base y Serpent Sting escala mejor con Attack Power.\u003c/li>\u003cli>\u003cstrong>Hunter's Mark\u003c/strong> no se puede poner varias veces usando rangos distintos.\u003c/li>\u003cli>Las mascotas ya no pierden su velocidad de ataque innata al desentrenarse.\u003c/li>\u003cli>Los enraizamientos que salen por proc (Entrapment, Improved Wing Clip, Counterattack) tienen rendimientos decrecientes.\u003c/li>\u003cli>\u003cstrong>Racial del troll:\u003c/strong> Berserking da solo un 10 % plano de velocidad de ataque y de lanzamiento. Se elimina Bow Specialization. Rapid Regeneration es una canalización nueva para curarte: tienes que estar quieto y se cancela si te pegan. Beast Slaying sigue (+5 % de daño contra bestias). Regeneration no cambia.\u003c/li>\u003c/ul>","text":"Auto Shot necesita que estés quieto 0,5 s para empezar. Todas las trampas comparten un tiempo de reutilización de 30 s y se pueden usar en combate. Mejoras al lanzamiento: Aimed Shot hace un 110 % más de daño extra, Arcane Shot un 30 % más de daño base y Serpent Sting escala mejor con Attack Power. Hunter's Mark no se puede poner varias veces usando rangos distintos. Las mascotas ya no pierden su velocidad de ataque innata al desentrenarse. Los enraizamientos que salen por proc (Entrapment, Improved Wing Clip, Counterattack) tienen rendimientos decrecientes. Racial del troll: Berserking da solo un 10 % plano de velocidad de ataque y de lanzamiento. Se elimina Bow Specialization. Rapid Regeneration es una canalización nueva para curarte: tienes que estar quieto y se cancela si te pegan. Beast Slaying sigue (+5 % de daño contra bestias). Regeneration no cambia.","range":null},{"title":"Munición y carcaj","titleHtml":"Munición y carcaj","slug":"municion-y-carcaj","html":"\u003cul>\u003cli>La munición \u003cstrong>sigue existiendo\u003c/strong>. El carcaj (Quiver) o la bolsa de munición (Ammo Pouch) ocupa un hueco de bolsa.\u003c/li>\u003cli>\u003cstrong>Lleva siempre munición de sobra\u003c/strong> y repón en cada vendedor. Arcos y ballestas usan flechas; rifles, balas.\u003c/li>\u003cli>Engineering fabrica munición.\u003c/li>\u003cli>Entre munición, carcaj y comida de la mascota las bolsas se llenan enseguida. Compra bolsas grandes en cuanto puedas y usa la bolsa de componentes de Forever.\u003c/li>\u003c/ul>","text":"La munición sigue existiendo. El carcaj (Quiver) o la bolsa de munición (Ammo Pouch) ocupa un hueco de bolsa. Lleva siempre munición de sobra y repón en cada vendedor. Arcos y ballestas usan flechas; rifles, balas. Engineering fabrica munición. Entre munición, carcaj y comida de la mascota las bolsas se llenan enseguida. Compra bolsas grandes en cuanto puedas y usa la bolsa de componentes de Forever.","range":null},{"title":"Macros (copiar tal cual)","titleHtml":"Macros (copiar tal cual)","slug":"macros-copiar-tal-cual","html":"\u003cdiv class=\"code\">\u003cbutton type=\"button\" class=\"copy\" data-copy-code>Copiar\u003c/button>\u003cpre>\u003ccode>#showtooltip\n/targetenemy [noexists][dead][help]\n/cast !Auto Shot\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton type=\"button\" class=\"copy\" data-copy-code>Copiar\u003c/button>\u003cpre>\u003ccode>#showtooltip\n/petattack [@mouseover,harm,nodead][]\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton type=\"button\" class=\"copy\" data-copy-code>Copiar\u003c/button>\u003cpre>\u003ccode>#showtooltip\n/cast [@mouseover,harm][]Hunter's Mark\u003c/code>\u003c/pre>\u003c/div>\n\u003cp>Mascota todo en uno (Mend Pet si está viva, Revive Pet si está muerta y Call Pet si no está):\u003c/p>\n\u003cdiv class=\"code\">\u003cbutton type=\"button\" class=\"copy\" data-copy-code>Copiar\u003c/button>\u003cpre>\u003ccode>#showtooltip\n/use [@pet,nodead,exists] Mend Pet\n/stopmacro [@pet,nodead,exists]\n/use [@pet,dead,exists] Revive Pet\n/castsequence reset=2 Call Pet, Revive Pet\u003c/code>\u003c/pre>\u003c/div>\n\u003cdiv class=\"code\">\u003cbutton type=\"button\" class=\"copy\" data-copy-code>Copiar\u003c/button>\u003cpre>\u003ccode>#showtooltip\n/cast [@cursor] !Eagle Eye\u003c/code>\u003c/pre>\u003c/div>","text":"`` showtooltip /targetenemy [noexists][dead][help] /cast !Auto Shot ` ` showtooltip /petattack [@mouseover,harm,nodead][] ` ` showtooltip /cast [@mouseover,harm][]Hunter's Mark ` Mascota todo en uno (Mend Pet si está viva, Revive Pet si está muerta y Call Pet si no está): ` showtooltip /use [@pet,nodead,exists] Mend Pet /stopmacro [@pet,nodead,exists] /use [@pet,dead,exists] Revive Pet /castsequence reset=2 Call Pet, Revive Pet ` ` showtooltip /cast [@cursor] !Eagle Eye ``","range":null},{"title":"Misiones de clase","titleHtml":"Misiones de clase","slug":"misiones-de-clase","html":"\u003cul>\u003cli>\u003cstrong>Nivel 10:\u003c/strong> &quot;Taming the Beast&quot; (Thotar, Razor Hill) → tres bestias de práctica → &quot;Training the Beast&quot; (Ormak Grimshot, Orgrimmar). Ver \u003ca href=\"#mascotas\">mascotas.md\u003c/a>.\u003c/li>\u003cli>Las guías de Forever no mencionan más misiones de clase durante el leveo. Si aparece alguna en el juego, apúntala aquí.\u003c/li>\u003c/ul>","text":"Nivel 10: \"Taming the Beast\" (Thotar, Razor Hill) → tres bestias de práctica → \"Training the Beast\" (Ormak Grimshot, Orgrimmar). Ver mascotas.md. Las guías de Forever no mencionan más misiones de clase durante el leveo. Si aparece alguna en el juego, apúntala aquí.","range":null},{"title":"Aspectos","titleHtml":"Aspectos","slug":"aspectos","html":"\u003cp>Solo puede haber uno activo a la vez:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Hawk:\u003c/strong> Attack Power a distancia. Es el normal.\u003c/li>\u003cli>\u003cstrong>Monkey:\u003c/strong> +8 % de esquivar. Para domar o si te pegan cuerpo a cuerpo.\u003c/li>\u003cli>\u003cstrong>Cheetah:\u003c/strong> +30 % de velocidad, pero te aturde si te golpean. Para viajar.\u003c/li>\u003cli>\u003cstrong>Pack:\u003c/strong> como Cheetah, pero para todo el grupo.\u003c/li>\u003cli>\u003cstrong>Beast:\u003c/strong> Attack Power cuerpo a cuerpo.\u003c/li>\u003cli>\u003cstrong>Wild:\u003c/strong> resistencia a la naturaleza.\u003c/li>\u003c/ul>\n\u003cp>Fuentes:\u003c/p>\n\u003cul>\u003cli>Warcraft Tavern, guía de cazador: \u003ca class=\"ext\" href=\"https://warcrafttavern.com/forever/guides/hunter/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Warcraft Tavern, cambios antes del lanzamiento: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/news/wow-forever-pre-launch-class-changes-bug-fixes/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Warcraft Tavern, raciales del troll: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/troll-racials/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Method: \u003ca class=\"ext\" href=\"https://www.method.gg/wow-forever/wow-forever-hunter-leveling-guide-and-talents\" target=\"_blank\" rel=\"noopener\">method.gg\u003c/a>\u003c/li>\u003c/ul>","text":"Solo puede haber uno activo a la vez: Hawk: Attack Power a distancia. Es el normal. Monkey: +8 % de esquivar. Para domar o si te pegan cuerpo a cuerpo. Cheetah: +30 % de velocidad, pero te aturde si te golpean. Para viajar. Pack: como Cheetah, pero para todo el grupo. Beast: Attack Power cuerpo a cuerpo. Wild: resistencia a la naturaleza. Fuentes: Warcraft Tavern, guía de cazador: https://warcrafttavern.com/forever/guides/hunter/ Warcraft Tavern, cambios antes del lanzamiento: https://www.warcrafttavern.com/forever/news/wow-forever-pre-launch-class-changes-bug-fixes/ Warcraft Tavern, raciales del troll: https://www.warcrafttavern.com/forever/guides/troll-racials/ Method: https://www.method.gg/wow-forever/wow-forever-hunter-leveling-guide-and-talents","range":null}]},"sistemas":{"title":"Sistemas de WoW Forever","intro":"","sections":[{"title":"Experiencia","titleHtml":"Experiencia","slug":"experiencia","html":"\u003cul>\u003cli>Del 1 al 60 hacen falta \u003cstrong>4.084.700 XP\u003c/strong>. No hay multiplicador global.\u003c/li>\u003cli>\u003cstrong>Rested XP:\u003c/strong> duplica la experiencia por muerte. No afecta a la de misiones. Se acumula en posadas, capitales y sobre la Cozy Sleeping Bag, también desconectado. Son 5 % del nivel cada 8 horas, hasta un máximo del 150 % del nivel.\u003c/li>\u003cli>\u003cstrong>Well Fed:\u003c/strong> +5 % de experiencia por muerte. Dura unos 15 minutos y se pierde al morir.\u003c/li>\u003cli>\u003cstrong>Grupo:\u003c/strong> con 5 jugadores, la experiencia de cada muerte se divide entre 5 y se multiplica por 1,4. Las misiones dan la misma experiencia.\u003c/li>\u003cli>\u003cstrong>Mazmorras:\u003c/strong> sus enemigos dan menos experiencia que en la versión clásica y sus misiones dan más. Si un miembro del grupo está \u003cstrong>más de 12 niveles por encima\u003c/strong>, los enemigos no dan experiencia. Que te suba un 60 no sirve.\u003c/li>\u003cli>El AoE grinding se ha nerfeado.\u003c/li>\u003cli>Solo da experiencia el primero que golpea al enemigo (o su grupo). Si el nombre del enemigo sale en gris, ya es de otro.\u003c/li>\u003c/ul>","text":"Del 1 al 60 hacen falta 4.084.700 XP. No hay multiplicador global. Rested XP: duplica la experiencia por muerte. No afecta a la de misiones. Se acumula en posadas, capitales y sobre la Cozy Sleeping Bag, también desconectado. Son 5 % del nivel cada 8 horas, hasta un máximo del 150 % del nivel. Well Fed: +5 % de experiencia por muerte. Dura unos 15 minutos y se pierde al morir. Grupo: con 5 jugadores, la experiencia de cada muerte se divide entre 5 y se multiplica por 1,4. Las misiones dan la misma experiencia. Mazmorras: sus enemigos dan menos experiencia que en la versión clásica y sus misiones dan más. Si un miembro del grupo está más de 12 niveles por encima, los enemigos no dan experiencia. Que te suba un 60 no sirve. El AoE grinding se ha nerfeado. Solo da experiencia el primero que golpea al enemigo (o su grupo). Si el nombre del enemigo sale en gris, ya es de otro.","range":null},{"title":"Rutina de descanso (cada vez que dejes de jugar)","titleHtml":"Rutina de descanso (cada vez que dejes de jugar)","slug":"rutina-de-descanso-cada-vez-que-dejes-de-jugar","html":"\u003col>\u003cli>Termina en una \u003cstrong>posada o capital\u003c/strong>, o haz un campamento.\u003c/li>\u003cli>Campamento:\u003cul>\u003cli>\u003cstrong>Basic Campfire\u003c/strong> (Cooking).\u003c/li>\u003cli>\u003cstrong>Camp Tent\u003c/strong> (Leatherworking): buff de experiencia de descanso de 1 hora que no se pierde al morir. Según Method, 1 minuto en la tienda junto al fuego da 1 burbuja de rested.\u003c/li>\u003cli>\u003cstrong>Camp Chair\u003c/strong> (Skinning 20): +2 % de crítico.\u003c/li>\u003cli>\u003cstrong>First Aid Kit\u003c/strong> (First Aid): Stamina.\u003c/li>\u003cli>Siéntate (\u003ccode>/sit\u003c/code>) \u003cstrong>1 minuto\u003c/strong> dentro del radio del fuego para recibir los buffs.\u003c/li>\u003c/ul>\u003c/li>\u003cli>Túmbate \u003cstrong>3 minutos\u003c/strong> en la \u003cstrong>Cozy Sleeping Bag\u003c/strong> para tener +3 % de experiencia durante 2 horas (tiempo de reutilización de 1 hora).\u003c/li>\u003cli>Invoca la mascota estando sentado junto al fuego para que ella también reciba los buffs.\u003c/li>\u003c/ol>\n\u003cp>Detalles del campamento:\u003c/p>\n\u003cul>\u003cli>El fuego dura 10 minutos y tiene 5 minutos de reutilización.\u003c/li>\u003cli>Cada personaje puede poner un objeto de campamento por hora.\u003c/li>\u003cli>Los buffs de campamento no se acumulan con los buffs de clase equivalentes.\u003c/li>\u003cli>Aún no se sabe con qué skill de Leatherworking se aprende la Camp Tent. Compruébalo en el entrenador.\u003c/li>\u003c/ul>","text":"Termina en una posada o capital, o haz un campamento. Campamento: Basic Campfire (Cooking). Camp Tent (Leatherworking): buff de experiencia de descanso de 1 hora que no se pierde al morir. Según Method, 1 minuto en la tienda junto al fuego da 1 burbuja de rested. Camp Chair (Skinning 20): +2 % de crítico. First Aid Kit (First Aid): Stamina. Siéntate (/sit) 1 minuto dentro del radio del fuego para recibir los buffs. Túmbate 3 minutos en la Cozy Sleeping Bag para tener +3 % de experiencia durante 2 horas (tiempo de reutilización de 1 hora). Invoca la mascota estando sentado junto al fuego para que ella también reciba los buffs. Detalles del campamento: El fuego dura 10 minutos y tiene 5 minutos de reutilización. Cada personaje puede poner un objeto de campamento por hora. Los buffs de campamento no se acumulan con los buffs de clase equivalentes. Aún no se sabe con qué skill de Leatherworking se aprende la Camp Tent. Compruébalo en el entrenador.","range":null},{"title":"Cozy Sleeping Bag (cadena de la Horda, desde nivel 14)","titleHtml":"Cozy Sleeping Bag (cadena de la Horda, desde nivel 14)","slug":"cozy-sleeping-bag-cadena-de-la-horda-desde-nivel-14","html":"\u003cp>Recompensa: \u003cstrong>Cozy Sleeping Bag\u003c/strong> (+1 % de experiencia por cada minuto tumbado, hasta +3 %; también acumula rested fuera de posadas) y 5 Student Fodder.\u003c/p>\n\u003col>\u003cli>\u003cstrong>The Barrens:\u003c/strong> Burned-Out Remains en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way The Barrens 46 74\" title=\"Copiar para TomTom\">The Barrens 46 74\u003c/button> → &quot;...and that note you found&quot;.\u003c/li>\u003cli>\u003cstrong>Westfall:\u003c/strong> viaja en barco Ratchet → Booty Bay, o en zepelín Orgrimmar → Grom'gol, y sube al norte. Haz clic en Nailed Plank en la granja Alexston Farmstead (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Westfall 37 50\" title=\"Copiar para TomTom\">Westfall 37 50\u003c/button>). Te da Swiftness Potion y Lesser Troll's Blood Potion, y empieza &quot;Stepping Stones&quot;.\u003c/li>\u003cli>\u003cstrong>Stonetalon Mountains:\u003c/strong> Pocket Litter, en un campamento de las colinas junto a Sun Rock Retreat (Flint and Tinder, 3 Simple Wood, Sturdy Lunchbox). Después, &quot;Scramble&quot;: Mound of Dirt, en la ladera al este. Da 3 Student Fodder, \u003cstrong>200 Feathered Arrow, 200 Exploding Shot y a elegir Precision Bow o Moonsight Rifle\u003c/strong>. Empieza &quot;Wet Job&quot;.\u003c/li>\u003cli>\u003cstrong>Loch Modan:\u003c/strong> zepelín a Undercity → Silverpine Forest → Hillsbrad Foothills → Arathi Highlands → puente sur a Wetlands → Loch Modan. Busca Carved Figurine en Stonewrought Dam (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Loch Modan 49 12\" title=\"Copiar para TomTom\">Loch Modan 49 12\u003c/button>); hay que saltar a una cornisa. Empieza &quot;Eagle's Fist&quot;.\u003c/li>\u003cli>\u003cstrong>Hillsbrad Foothills:\u003c/strong> vuelve al norte por Wetlands y Arathi y cruza la puerta de Thoradin's Wall. Sube por el carro apoyado en el muro norte (barril → tabla → carro → muro) y sigue el muro hacia el sur. Al final del pasillo están Messenger Bag y, debajo, \u003cstrong>Hastily Rolled-Up Satchel\u003c/strong>, que completa &quot;This Must Be the Place&quot;.\u003c/li>\u003c/ol>\n\u003cp>Momento recomendado (la cadena va en orden y obliga a cambiar de continente dos veces):\u003c/p>\n\u003col>\u003cli>\u003cstrong>A 14\u003c/strong>, en The Barrens: recoge la nota.\u003c/li>\u003cli>\u003cstrong>A 18-20\u003c/strong>, después de Wailing Caverns: viaje a Westfall en barco desde Ratchet y vuelta.\u003c/li>\u003cli>\u003cstrong>A 20-23\u003c/strong>: paso de Stonetalon, dentro de la ruta normal. Te da el arco o el rifle.\u003c/li>\u003cli>\u003cstrong>A 23-25\u003c/strong>: viaje a Loch Modan y Hillsbrad. Si vas por la alternativa de Hillsbrad en ese tramo, aprovecha y hazlo ahí.\u003c/li>\u003c/ol>\n\u003cp>Es mucho viaje, pero la bolsa se usa hasta 60. La cadena pasa cerca de varios libros de biblioteca.\u003c/p>","text":"Recompensa: Cozy Sleeping Bag (+1 % de experiencia por cada minuto tumbado, hasta +3 %; también acumula rested fuera de posadas) y 5 Student Fodder. The Barrens: Burned-Out Remains en /way The Barrens 46 74 → \"...and that note you found\". Westfall: viaja en barco Ratchet → Booty Bay, o en zepelín Orgrimmar → Grom'gol, y sube al norte. Haz clic en Nailed Plank en la granja Alexston Farmstead (/way Westfall 37 50). Te da Swiftness Potion y Lesser Troll's Blood Potion, y empieza \"Stepping Stones\". Stonetalon Mountains: Pocket Litter, en un campamento de las colinas junto a Sun Rock Retreat (Flint and Tinder, 3 Simple Wood, Sturdy Lunchbox). Después, \"Scramble\": Mound of Dirt, en la ladera al este. Da 3 Student Fodder, 200 Feathered Arrow, 200 Exploding Shot y a elegir Precision Bow o Moonsight Rifle. Empieza \"Wet Job\". Loch Modan: zepelín a Undercity → Silverpine Forest → Hillsbrad Foothills → Arathi Highlands → puente sur a Wetlands → Loch Modan. Busca Carved Figurine en Stonewrought Dam (/way Loch Modan 49 12); hay que saltar a una cornisa. Empieza \"Eagle's Fist\". Hillsbrad Foothills: vuelve al norte por Wetlands y Arathi y cruza la puerta de Thoradin's Wall. Sube por el carro apoyado en el muro norte (barril → tabla → carro → muro) y sigue el muro hacia el sur. Al final del pasillo están Messenger Bag y, debajo, Hastily Rolled-Up Satchel, que completa \"This Must Be the Place\". Momento recomendado (la cadena va en orden y obliga a cambiar de continente dos veces): A 14, en The Barrens: recoge la nota. A 18-20, después de Wailing Caverns: viaje a Westfall en barco desde Ratchet y vuelta. A 20-23: paso de Stonetalon, dentro de la ruta normal. Te da el arco o el rifle. A 23-25: viaje a Loch Modan y Hillsbrad. Si vas por la alternativa de Hillsbrad en ese tramo, aprovecha y hazlo ahí. Es mucho viaje, pero la bolsa se usa hasta 60. La cadena pasa cerca de varios libros de biblioteca.","range":null},{"title":"Legacy (tecla Y)","titleHtml":"Legacy (tecla Y)","slug":"legacy-tecla-y","html":"\u003cp>Es un sistema de cuenta. Se desbloquea con tu primer punto: llegar a \u003cstrong>nivel 25\u003c/strong> o a 150 de skill en una profesión de fabricación, como Leatherworking.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Cómo se consiguen puntos:\u003c/strong>\u003cul>\u003cli>Llegar a nivel 25, 45 (o 40) y 60 con cada clase.\u003c/li>\u003cli>Llegar a 150, 225 y 300 en profesiones de fabricación.\u003c/li>\u003cli>Matar los jefes de las listas Spelunker en mazmorras.\u003c/li>\u003cli>Explore Azeroth.\u003c/li>\u003cli>Rangos de honor PvP.\u003c/li>\u003cli>Raids.\u003c/li>\u003c/ul>\u003c/li>\u003cli>Al lanzamiento puedes invertir como máximo \u003cstrong>16 puntos\u003c/strong> en total.\u003c/li>\u003cli>\u003cstrong>Perks útiles para el leveo\u003c/strong> (orden recomendado):\u003col>\u003cli>\u003cstrong>Frequent Flier\u003c/strong> (1 rango): vuelos al 50 % y montura un 20 % más rápida.\u003c/li>\u003cli>\u003cstrong>Talented\u003c/strong> (5 rangos): los puntos de talento llegan antes, desde nivel 9. Hasta 5 puntos de ventaja.\u003c/li>\u003cli>\u003cstrong>Well Rested\u003c/strong> (5 rangos): +4 % de acumulación y de tope de rested por rango.\u003c/li>\u003cli>\u003cstrong>Bartering\u003c/strong> (2 rangos): vendedores un 5 % más baratos.\u003c/li>\u003cli>\u003cstrong>Field Guide\u003c/strong> (3 rangos): -8 % de reutilización de los objetos de campamento. \u003cstrong>Permanence\u003c/strong> (2 rangos): los buffs de campamento duran un 50 % más.\u003c/li>\u003c/ol>\u003c/li>\u003cli>Los perks se reinician en el entrenador de clase, pagando.\u003c/li>\u003c/ul>","text":"Es un sistema de cuenta. Se desbloquea con tu primer punto: llegar a nivel 25 o a 150 de skill en una profesión de fabricación, como Leatherworking. Cómo se consiguen puntos: Llegar a nivel 25, 45 (o 40) y 60 con cada clase. Llegar a 150, 225 y 300 en profesiones de fabricación. Matar los jefes de las listas Spelunker en mazmorras. Explore Azeroth. Rangos de honor PvP. Raids. Al lanzamiento puedes invertir como máximo 16 puntos en total. Perks útiles para el leveo (orden recomendado): Frequent Flier (1 rango): vuelos al 50 % y montura un 20 % más rápida. Talented (5 rangos): los puntos de talento llegan antes, desde nivel 9. Hasta 5 puntos de ventaja. Well Rested (5 rangos): +4 % de acumulación y de tope de rested por rango. Bartering (2 rangos): vendedores un 5 % más baratos. Field Guide (3 rangos): -8 % de reutilización de los objetos de campamento. Permanence (2 rangos): los buffs de campamento duran un 50 % más. Los perks se reinician en el entrenador de clase, pagando.","range":null},{"title":"Montura y doble especialización","titleHtml":"Montura y doble especialización","slug":"montura-y-doble-especializacion","html":"\u003cul>\u003cli>\u003cstrong>Nivel 40:\u003c/strong> Apprentice Riding (+60 % de velocidad). El entrenador troll es Xar'Ti, en Durotar. Ver \u003ca href=\"#dinero\">dinero.md\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Nivel 60:\u003c/strong> Journeyman Riding (+100 % de velocidad). No hay monturas voladoras.\u003c/li>\u003cli>\u003cstrong>Nivel 40:\u003c/strong> doble especialización en el entrenador de clase. Ver \u003ca href=\"#talentos\">talentos.md\u003c/a>.\u003c/li>\u003c/ul>","text":"Nivel 40: Apprentice Riding (+60 % de velocidad). El entrenador troll es Xar'Ti, en Durotar. Ver dinero.md. Nivel 60: Journeyman Riding (+100 % de velocidad). No hay monturas voladoras. Nivel 40: doble especialización en el entrenador de clase. Ver talentos.md.","range":null},{"title":"Otros sistemas","titleHtml":"Otros sistemas","slug":"otros-sistemas","html":"\u003cul>\u003cli>\u003cstrong>Bolsa de componentes:\u003c/strong> tiene un hueco propio y no ocupa ninguno de los 4 de bolsas. Va de Linen (6) a Bottomless (20).\u003c/li>\u003cli>Transfiguración y colecciones son de cuenta.\u003c/li>\u003cli>No hay escalado de nivel en las zonas.\u003c/li>\u003c/ul>\n\u003cp>Fuentes (Warcraft Tavern y Warcraft Wiki; ver \u003ca href=\"#fuentes\">fuentes.md\u003c/a>):\u003c/p>\n\u003cul>\u003cli>Experiencia: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/experience/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Camping: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/camping/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Legacy: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/legacy/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Riding: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/riding/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Cozy Sleeping Bag: \u003ca class=\"ext\" href=\"https://www.warcrafttavern.com/forever/guides/cozy-sleeping-bag/\" target=\"_blank\" rel=\"noopener\">warcrafttavern.com\u003c/a>\u003c/li>\u003cli>Warcraft Wiki: \u003ca class=\"ext\" href=\"https://warcraft.wiki.gg/wiki/WoW_Forever\" target=\"_blank\" rel=\"noopener\">warcraft.wiki.gg\u003c/a>\u003c/li>\u003c/ul>","text":"Bolsa de componentes: tiene un hueco propio y no ocupa ninguno de los 4 de bolsas. Va de Linen (6) a Bottomless (20). Transfiguración y colecciones son de cuenta. No hay escalado de nivel en las zonas. Fuentes (Warcraft Tavern y Warcraft Wiki; ver fuentes.md): Experiencia: https://www.warcrafttavern.com/forever/guides/experience/ Camping: https://www.warcrafttavern.com/forever/guides/camping/ Legacy: https://www.warcrafttavern.com/forever/guides/legacy/ Riding: https://www.warcrafttavern.com/forever/guides/riding/ Cozy Sleeping Bag: https://www.warcrafttavern.com/forever/guides/cozy-sleeping-bag/ Warcraft Wiki: https://warcraft.wiki.gg/wiki/WoW_Forever","range":null}]},"profesiones":{"title":"Profesiones","intro":"","sections":[{"title":"Elección para el leveo","titleHtml":"Elección para el leveo","slug":"eleccion-para-el-leveo","html":"\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tipo\u003c/th>\u003cth>Profesión\u003c/th>\u003cth>Para qué\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Primaria\u003c/td>\u003ctd>\u003cstrong>Skinning\u003c/strong>\u003c/td>\u003ctd>Da cuero para Leatherworking y para vender. Con Skinning 20 fabricas Camp Chair (+2 % de crítico en el campamento)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Primaria\u003c/td>\u003ctd>\u003cstrong>Leatherworking\u003c/strong>\u003c/td>\u003ctd>Equipo de Agility BoP para ti y \u003cstrong>Camp Tent\u003c/strong>, que da experiencia de descanso (rested)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secundaria\u003c/td>\u003ctd>\u003cstrong>Cooking\u003c/strong>\u003c/td>\u003ctd>Comida con Well Fed (+5 % de experiencia por muerte). \u003cstrong>Imprescindible para encender el campamento\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secundaria\u003c/td>\u003ctd>\u003cstrong>First Aid\u003c/strong>\u003c/td>\u003ctd>Vendas y, en Forever, también \u003cstrong>Healing Potions\u003c/strong>. Su objeto de campamento da Stamina\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Secundaria\u003c/td>\u003ctd>Fishing\u003c/td>\u003ctd>Opcional. Su objeto de campamento da +8 % a todas las estadísticas y sirve para Cooking\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Alternativa para a 60: \u003cstrong>Engineering + Mining\u003c/strong> da Sniper Scope, rifles BoE y munición. No compensa mientras subes.\u003c/p>","text":"Tipo Profesión Para qué Primaria Skinning Da cuero para Leatherworking y para vender. Con Skinning 20 fabricas Camp Chair (+2 % de crítico en el campamento) Primaria Leatherworking Equipo de Agility BoP para ti y Camp Tent, que da experiencia de descanso (rested) Secundaria Cooking Comida con Well Fed (+5 % de experiencia por muerte). Imprescindible para encender el campamento Secundaria First Aid Vendas y, en Forever, también Healing Potions. Su objeto de campamento da Stamina Secundaria Fishing Opcional. Su objeto de campamento da +8 % a todas las estadísticas y sirve para Cooking Alternativa para a 60: Engineering + Mining da Sniper Scope, rifles BoE y munición. No compensa mientras subes.","range":null},{"title":"Skinning","titleHtml":"Skinning","slug":"skinning","html":"\u003cul>\u003cli>\u003cstrong>1-75:\u003c/strong> Durotar. \u003cstrong>75-125:\u003c/strong> The Barrens. \u003cstrong>125-225:\u003c/strong> The Barrens → Thousand Needles. \u003cstrong>225-300:\u003c/strong> Riverglades, The Hinterlands (250+) y Un'Goro Crater (275-300).\u003c/li>\u003cli>El rango Artisan se aprende a 200 con cualquier entrenador de una capital.\u003c/li>\u003cli>\u003cstrong>Keen Skinning Knife\u003c/strong> (+3) es exclusivo de la Horda y lo da la misión Unwelcome Guests.\u003c/li>\u003cli>Desuella \u003cstrong>todo\u003c/strong> lo que mates. Mientras desuellas, la mascota puede ir a por el siguiente enemigo.\u003c/li>\u003c/ul>","text":": Durotar. 75-125: The Barrens. 125-225: The Barrens → Thousand Needles. 225-300: Riverglades, The Hinterlands (250+) y Un'Goro Crater (275-300). El rango Artisan se aprende a 200 con cualquier entrenador de una capital. Keen Skinning Knife (+3) es exclusivo de la Horda y lo da la misión Unwelcome Guests. Desuella todo lo que mates. Mientras desuellas, la mascota puede ir a por el siguiente enemigo.","range":null},{"title":"Leatherworking","titleHtml":"Leatherworking","slug":"leatherworking","html":"\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Rango\u003c/th>\u003cth>Skill\u003c/th>\u003cth>Nivel de personaje\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Apprentice\u003c/td>\u003ctd>1-75\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Journeyman\u003c/td>\u003ctd>75-150\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Expert\u003c/td>\u003ctd>150-225\u003c/td>\u003ctd>20\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Artisan\u003c/td>\u003ctd>225-300\u003c/td>\u003ctd>35\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cul>\u003cli>Entrenadores de la Horda: Karolek (Orgrimmar, Expert), Una (Thunder Bluff, Artisan) y Hahrana Ironhide (Feralas, Master: Nightscape Pants).\u003c/li>\u003cli>Recetas útiles: Hillman's Shoulders (105), Barbaric Shoulders (150), Guardian Gloves (165), Nightscape Headband (180), Nightscape Pants (205), Wild Leather Leggings (215), Wicked Leather Gauntlets (235), Runic Leather Headband (265) y Heavy Scorpid Helm (270).\u003c/li>\u003cli>\u003cstrong>Camp Tent:\u003c/strong> aún no se sabe con qué skill se aprende. Compruébalo en el entrenador y apúntalo aquí. Ver \u003ca href=\"#sistemas\">sistemas-forever.md\u003c/a>.\u003c/li>\u003cli>Llegar a 150, 225 y 300 te da \u003cstrong>puntos de Legacy\u003c/strong>.\u003c/li>\u003c/ul>","text":"Rango Skill Nivel de personaje Apprentice 1-75 5 Journeyman 75-150 10 Expert 150-225 20 Artisan 225-300 35 Entrenadores de la Horda: Karolek (Orgrimmar, Expert), Una (Thunder Bluff, Artisan) y Hahrana Ironhide (Feralas, Master: Nightscape Pants). Recetas útiles: Hillman's Shoulders (105), Barbaric Shoulders (150), Guardian Gloves (165), Nightscape Headband (180), Nightscape Pants (205), Wild Leather Leggings (215), Wicked Leather Gauntlets (235), Runic Leather Headband (265) y Heavy Scorpid Helm (270). Camp Tent: aún no se sabe con qué skill se aprende. Compruébalo en el entrenador y apúntalo aquí. Ver sistemas-forever.md. Llegar a 150, 225 y 300 te da puntos de Legacy.","range":null},{"title":"Cooking","titleHtml":"Cooking","slug":"cooking","html":"\u003cul>\u003cli>El rango Expert se aprende con Expert Cookbook, que vende Wulan en Desolace. El Artisan, con la misión Clamlette Surprise (Dirge Quikcleave, Tanaris).\u003c/li>\u003cli>Campamentos por rango: Basic Campfire (Cooking 1: Flint and Tinder + Simple Wood), Journeyman (140: Star Wood) y Expert (220: Thick Logs).\u003c/li>\u003cli>\u003cstrong>Cocina la carne de lo que mates\u003c/strong> y lleva siempre comida de Well Fed.\u003c/li>\u003c/ul>","text":"El rango Expert se aprende con Expert Cookbook, que vende Wulan en Desolace. El Artisan, con la misión Clamlette Surprise (Dirge Quikcleave, Tanaris). Campamentos por rango: Basic Campfire (Cooking 1: Flint and Tinder + Simple Wood), Journeyman (140: Star Wood) y Expert (220: Thick Logs). Cocina la carne de lo que mates y lleva siempre comida de Well Fed.","range":null},{"title":"First Aid","titleHtml":"First Aid","slug":"first-aid","html":"\u003cul>\u003cli>Recetas: Minor Healing Potion (1), First Aid Kit (20, misión &quot;Camping 101: First Aid&quot;), Lesser Healing Potion (55), Healing Potion (110) y Woolen Tourniquet (120).\u003c/li>\u003cli>El rango Expert se aprende con el libro Expert First Aid - Under Wraps, que vende Balai Lok'Wein en Dustwallow Marsh. El Artisan, con la misión \u003cstrong>Triage\u003c/strong> (Doctor Gregory Victor, Arathi Highlands).\u003c/li>\u003c/ul>","text":"Recetas: Minor Healing Potion (1), First Aid Kit (20, misión \"Camping 101: First Aid\"), Lesser Healing Potion (55), Healing Potion (110) y Woolen Tourniquet (120). El rango Expert se aprende con el libro Expert First Aid - Under Wraps, que vende Balai Lok'Wein en Dustwallow Marsh. El Artisan, con la misión Triage (Doctor Gregory Victor, Arathi Highlands).","range":null},{"title":"Fishing (opcional)","titleHtml":"Fishing (opcional)","slug":"fishing-opcional","html":"\u003cul>\u003cli>El rango Expert se aprende con The Bass And You (Old Man Heming, Booty Bay, 1 g). El Artisan, con la misión Nat Pagle, Angler Extreme (Dustwallow Marsh).\u003c/li>\u003c/ul>\n\u003cp>Fuentes: guías de profesiones de Method (Leatherworking, Skinning, First Aid, Cooking y Fishing; ver \u003ca href=\"#fuentes\">fuentes.md\u003c/a>).\u003c/p>","text":"El rango Expert se aprende con The Bass And You (Old Man Heming, Booty Bay, 1 g). El Artisan, con la misión Nat Pagle, Angler Extreme (Dustwallow Marsh). Fuentes: guías de profesiones de Method (Leatherworking, Skinning, First Aid, Cooking y Fishing; ver fuentes.md).","range":null}]},"dinero":{"title":"Dinero","intro":"\u003cp>No hay ninguna guía de oro escrita para WoW Forever. Estos objetivos salen de los costes conocidos del juego.\u003c/p>","sections":[{"title":"Objetivos de oro","titleHtml":"Objetivos de oro","slug":"objetivos-de-oro","html":"\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nivel\u003c/th>\u003cth>Gasto\u003c/th>\u003cth>Oro necesario\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1-60\u003c/td>\u003ctd>Entrenar todos los hechizos\u003c/td>\u003ctd>Unos 206 g en total. Con la lista de \u003ca href=\"#hechizos\">hechizos.md\u003c/a> gastas bastante menos\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>40\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Apprentice Riding + raptor\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Unos 120 g\u003c/strong> (100 g de entrenamiento y 20 g la montura, según Warcraft Tavern. Warcraft Wiki dice 90 g con la primera montura gratis). Teniendo Honored con tu facción de origen tienes un 10 % de descuento\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40\u003c/td>\u003ctd>Doble especialización (opcional)\u003c/td>\u003ctd>50 g. Déjala para después de la montura\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60\u003c/td>\u003ctd>Journeyman Riding + montura épica\u003c/td>\u003ctd>Unos 1000 g + 200 g (Warcraft Wiki: 900 g + 200 g)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Riding de los trolls: entrenador \u003cstrong>Xar'Ti\u003c/strong> (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Durotar 55.3 75.5\" title=\"Copiar para TomTom\">Durotar 55.3 75.5\u003c/button>) y vendedor de raptores \u003cstrong>Zjolnir\u003c/strong> (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Durotar 55.2 75.7\" title=\"Copiar para TomTom\">Durotar 55.2 75.7\u003c/button>).\u003c/p>","text":"Nivel Gasto Oro necesario Entrenar todos los hechizos Unos 206 g en total. Con la lista de hechizos.md gastas bastante menos Apprentice Riding + raptor Unos 120 g (100 g de entrenamiento y 20 g la montura, según Warcraft Tavern. Warcraft Wiki dice 90 g con la primera montura gratis). Teniendo Honored con tu facción de origen tienes un 10 % de descuento Doble especialización (opcional) 50 g. Déjala para después de la montura Journeyman Riding + montura épica Unos 1000 g + 200 g (Warcraft Wiki: 900 g + 200 g) Riding de los trolls: entrenador Xar'Ti (/way Durotar 55.3 75.5) y vendedor de raptores Zjolnir (/way Durotar 55.2 75.7).","range":null},{"title":"Cómo ganar dinero mientras subes","titleHtml":"Cómo ganar dinero mientras subes","slug":"como-ganar-dinero-mientras-subes","html":"\u003col>\u003cli>\u003cstrong>Vende en la subasta (Auction House)\u003c/strong> el cuero que no uses en Leatherworking, la tela (Linen, Wool, Silk, Mageweave, Runecloth) y los objetos verdes y azules BoE que no te sirvan.\u003c/li>\u003cli>\u003cstrong>Al vendedor\u003c/strong>, todo lo gris.\u003c/li>\u003cli>\u003cstrong>No entrenes los rangos marcados como &quot;Saltar&quot;\u003c/strong> en \u003ca href=\"#hechizos\">hechizos.md\u003c/a>.\u003c/li>\u003cli>\u003cstrong>No compres equipo en la subasta\u003c/strong> mientras subes, salvo un arma a distancia que sea una gran mejora (por ejemplo, un Thorium Rifle barato a 47).\u003c/li>\u003cli>\u003cstrong>Perk de Legacy Frequent Flier:\u003c/strong> los vuelos cuestan un 50 % menos y la montura va un 20 % más rápida. \u003cstrong>Bartering:\u003c/strong> los vendedores cobran un 5 % menos. Ver \u003ca href=\"#sistemas\">sistemas-forever.md\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Misiones de Riverglades y del 40+:\u003c/strong> en general dan más oro.\u003c/li>\u003cli>\u003cstrong>A 60:\u003c/strong> las misiones semanales &quot;In Demand&quot; de Pix Xizzix en Booty Bay dan un Undermine Satchel (10-100 g).\u003c/li>\u003c/ol>","text":"Vende en la subasta (Auction House) el cuero que no uses en Leatherworking, la tela (Linen, Wool, Silk, Mageweave, Runecloth) y los objetos verdes y azules BoE que no te sirvan. Al vendedor, todo lo gris. No entrenes los rangos marcados como \"Saltar\" en hechizos.md. No compres equipo en la subasta mientras subes, salvo un arma a distancia que sea una gran mejora (por ejemplo, un Thorium Rifle barato a 47). Perk de Legacy Frequent Flier: los vuelos cuestan un 50 % menos y la montura va un 20 % más rápida. Bartering: los vendedores cobran un 5 % menos. Ver sistemas-forever.md. Misiones de Riverglades y del 40+: en general dan más oro. A 60: las misiones semanales \"In Demand\" de Pix Xizzix en Booty Bay dan un Undermine Satchel (10-100 g).","range":null},{"title":"Nunca hagas esto","titleHtml":"Nunca hagas esto","slug":"nunca-hagas-esto","html":"\u003cul>\u003cli>\u003cstrong>No compres oro ni subidas de nivel\u003c/strong> (Overgear, expcarry, u4n y similares). Va contra las normas de Blizzard y te pueden cerrar la cuenta.\u003c/li>\u003c/ul>","text":"No compres oro ni subidas de nivel (Overgear, expcarry, u4n y similares). Va contra las normas de Blizzard y te pueden cerrar la cuenta.","range":null}]},"addons":{"title":"Addons","intro":"\u003cp>Decisión del usuario: \u003cstrong>todos los de calidad de vida (QoL)\u003c/strong> y \u003cstrong>ninguno de guía de leveo\u003c/strong>.\u003c/p>\n\u003cp>En Forever los addons funcionan con la misma API y las mismas restricciones que el WoW actual (retail). Los de Classic Era no tienen por qué funcionar. \u003cstrong>Instala solo versiones marcadas como compatibles con WoW Forever\u003c/strong> en CurseForge.\u003c/p>","sections":[{"title":"Instalar","titleHtml":"Instalar","slug":"instalar","html":"\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Addon\u003c/th>\u003cth>Para qué\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>TomTom\u003c/strong>\u003c/td>\u003ctd>Flecha de navegación. Escribe \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way &lt;zona&gt; &lt;x&gt; &lt;y&gt;\" title=\"Copiar para TomTom\">&lt;zona&gt; &lt;x&gt; &lt;y&gt;\u003c/button> con las coordenadas de esta guía\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Forever Flight Times\u003c/strong>\u003c/td>\u003ctd>Tiempo que falta para llegar en cada vuelo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Details!\u003c/strong>\u003c/td>\u003ctd>Medidor de daño (Forever ya trae uno integrado; Details! es más completo)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Deadly Boss Mods\u003c/strong>\u003c/td>\u003ctd>Avisos en los jefes de mazmorra\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>BugGrabber + BugSack\u003c/strong>\u003c/td>\u003ctd>Recogen los errores de otros addons para que no molesten\u003c/td>\u003c/tr>\u003ctr>\u003ctd>PP Forever\u003c/td>\u003ctd>Gestión de buffs, útil en grupo\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Gladius Reloaded\u003c/td>\u003ctd>Marcos de arena para PvP (a 60)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DynamicCam\u003c/td>\u003ctd>Cámara más dinámica (opcional)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>EllesmereUI\u003c/td>\u003ctd>Reemplazo de la interfaz (opcional)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","text":"Addon Para qué TomTom Flecha de navegación. Escribe /way \u003czona> \u003cx> \u003cy> con las coordenadas de esta guía Forever Flight Times Tiempo que falta para llegar en cada vuelo Details! Medidor de daño (Forever ya trae uno integrado; Details! es más completo) Deadly Boss Mods Avisos en los jefes de mazmorra BugGrabber + BugSack Recogen los errores de otros addons para que no molesten PP Forever Gestión de buffs, útil en grupo Gladius Reloaded Marcos de arena para PvP (a 60) DynamicCam Cámara más dinámica (opcional) EllesmereUI Reemplazo de la interfaz (opcional)","range":null},{"title":"No instalar (guía de leveo o de misiones)","titleHtml":"No instalar (guía de leveo o de misiones)","slug":"no-instalar-guia-de-leveo-o-de-misiones","html":"\u003cul>\u003cli>\u003cstrong>Questie\u003c/strong>, \u003cstrong>Quest XP Tracker\u003c/strong>, \u003cstrong>Forever Quest Tint\u003c/strong>: marcan misiones y rutas. El usuario no los quiere.\u003c/li>\u003cli>Ningún addon de rutas paso a paso, como RestedXP.\u003c/li>\u003c/ul>","text":"Questie, Quest XP Tracker, Forever Quest Tint: marcan misiones y rutas. El usuario no los quiere. Ningún addon de rutas paso a paso, como RestedXP.","range":null},{"title":"Pendiente de buscar","titleHtml":"Pendiente de buscar","slug":"pendiente-de-buscar","html":"\u003cp>La lista de CurseForge no tenía ningún addon específico de cazador (felicidad de la mascota, munición o swing timer de Auto Shot), ni de bolsas o de subasta. Cuando el usuario instale el juego, busca versiones de Forever de:\u003c/p>\n\u003cul>\u003cli>un \u003cstrong>swing timer de Auto Shot\u003c/strong>;\u003c/li>\u003cli>un addon de \u003cstrong>bolsas\u003c/strong>;\u003c/li>\u003cli>un addon de \u003cstrong>subasta\u003c/strong> (por ejemplo, Auctionator).\u003c/li>\u003c/ul>\n\u003cp>Fuentes:\u003c/p>\n\u003cul>\u003cli>CurseForge, lista de addons: \u003ca class=\"ext\" href=\"https://blog.curseforge.com/wow-forever-usefull-addon-list/\" target=\"_blank\" rel=\"noopener\">blog.curseforge.com\u003c/a>\u003c/li>\u003cli>GamesRadar, restricciones de addons: \u003ca class=\"ext\" href=\"https://www.gamesradar.com/games/world-of-warcraft/world-of-warcraft-forever-takes-page-out-of-retails-book-as-blizzard-confirms-access-to-add-ons-will-be-restricted-in-the-throwback-mmo/\" target=\"_blank\" rel=\"noopener\">gamesradar.com\u003c/a>\u003c/li>\u003c/ul>","text":"La lista de CurseForge no tenía ningún addon específico de cazador (felicidad de la mascota,
