<meta charset="utf-8">
<title>Diario del Cazador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra lateral fija con la navegación + columna de lectura; en móvil, pestañas arriba.
   Diario de cazador de noche: pizarra verde-azulada (selva troll), ámbar de quest y óxido de la Horda. */
:root {
  --bg: #0f1719;
  --surface: #162125;
  --surface-2: #1c2a2f;
  --line: #283a40;
  --fg: #e4ebe8;
  --muted: #8fa3a0;
  --accent: #e3a93b;
  --accent-ink: #1a1204;
  --rust: #cf5b3e;
  --link: #74c6cb;
  --q-grey: #8d9493;
  --q-green: #4fc35a;
  --q-yellow: #e8cb2e;
  --q-orange: #ff8b2b;
  --q-red: #ff4d43;
  --font-display: "Grenze", "Palatino Linotype", Georgia, serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, ui-monospace, monospace;
  --radius: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edf1ef; --surface: #ffffff; --surface-2: #f4f7f6; --line: #d3ddda;
    --fg: #14201f; --muted: #5a6c69; --accent: #a66a00; --accent-ink: #ffffff; --rust: #a83d24; --link: #17707a;
    --q-grey: #7b8281; --q-green: #23862d; --q-yellow: #9c7d00; --q-orange: #c25a00; --q-red: #c62a22;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf1ef; --surface: #ffffff; --surface-2: #f4f7f6; --line: #d3ddda;
  --fg: #14201f; --muted: #5a6c69; --accent: #a66a00; --accent-ink: #ffffff; --rust: #a83d24; --link: #17707a;
  --q-grey: #7b8281; --q-green: #23862d; --q-yellow: #9c7d00; --q-orange: #c25a00; --q-red: #c62a22;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 16px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--link); text-underline-offset: 2px; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
strong { color: var(--fg); font-weight: 700; }

.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }

/* ---------- Barra lateral ---------- */
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 20px;
}
.brand { display: flex; gap: 12px; align-items: center; text-decoration: none; color: var(--fg); }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; line-height: 1; display: block; }
.brand small { display: block; margin-top: 4px; color: var(--muted); font-size: .7rem; line-height: 1.3; letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 10px; border-radius: 7px; color: var(--muted); text-decoration: none; font-weight: 600; font-size: .95rem;
}
.nav a:hover { background: var(--surface-2); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--surface-2); color: var(--accent); box-shadow: inset 2px 0 0 var(--accent); }
.nav .grp { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; opacity: .8; }
.side-foot { margin-top: auto; font-size: .78rem; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.theme-btn {
  align-self: flex-start; background: none; border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 4px 12px; font: inherit; cursor: pointer;
}
.theme-btn:hover { color: var(--fg); border-color: var(--muted); }

/* ---------- Barra superior (nivel + búsqueda) ---------- */
.main { min-width: 0; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
}
.lvl { display: flex; align-items: center; gap: 8px; }
.lvl label { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lvl button {
  width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); font: 700 1rem var(--font-mono); cursor: pointer;
}
.lvl button:hover { border-color: var(--accent); color: var(--accent); }
.lvl output {
  font: 700 1.5rem/1 var(--font-display); color: var(--accent); min-width: 2ch; text-align: center;
  font-variant-numeric: tabular-nums;
}
.lvl input[type=range] { width: 140px; accent-color: var(--accent); }
.lvl .reset { width: auto; padding: 0 10px; font: 600 .78rem var(--font-body); color: var(--muted); }
.search { flex: 1 1 200px; position: relative; min-width: 0; }
.search input {
  width: 100%; background: var(--surface); border: 1px solid var(--line); color: var(--fg);
  border-radius: 8px; padding: 7px 12px 7px 34px; font: inherit; font-size: .95rem;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 60vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 16px 40px rgb(0 0 0 / .35); padding: 6px;
}
.results a { display: block; padding: 8px 10px; border-radius: 7px; text-decoration: none; color: var(--fg); }
.results a:hover, .results a.sel { background: var(--surface-2); }
.results .where { font-size: .75rem; color: var(--accent); font-weight: 700; letter-spacing: .04em; }
.results .snip { font-size: .85rem; color: var(--muted); }
.results mark { background: none; color: var(--fg); font-weight: 700; }
.results .none { padding: 10px; color: var(--muted); font-size: .9rem; }

/* ---------- Contenido ---------- */
.content {
  padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1120px;
}
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

/* Hero del inicio */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 28px; }
.crest {
  width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 50% 40%, var(--surface-2), var(--surface));
  border: 2px solid var(--accent);
}
.crest b { font: 700 3.2rem/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.crest span { position: absolute; bottom: -10px; background: var(--accent); color: var(--accent-ink); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 10px; border-radius: 999px; }
.hero h1 { font-size: clamp(2rem, 4.5vw, 3rem); }
.hero h1 em { font-style: normal; color: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; color: var(--muted); font-size: .92rem; }
.facts b { color: var(--fg); font-weight: 600; }

/* Línea de tramos */
.track-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 12px; margin-bottom: 24px; }
.track-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; margin-bottom: 12px; }
.track-head h2 { font-size: 1.35rem; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.rows { display: flex; flex-direction: column; gap: 3px; }
.trow {
  display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; align-items: center;
  background: none; border: 0; padding: 3px 6px; border-radius: 6px; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%;
}
.trow:hover { background: var(--surface-2); }
.trow .tl { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .tl small { color: var(--muted); font-family: var(--font-mono); font-size: .74rem; margin-right: 6px; }
.trow.dg .tl { color: var(--muted); font-style: italic; }
.bar { position: relative; height: 14px; }
.bar::before { content: ""; position: absolute; inset: 6px 0; background: var(--line); border-radius: 2px; }
.bar i { position: absolute; top: 1px; height: 12px; border-radius: 3px; background: currentColor; }
.trow.dg .bar i { background: repeating-linear-gradient(135deg, currentColor 0 4px, transparent 4px 7px); border: 1px solid currentColor; }
.bar .now { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); border-radius: 1px; }
.axis { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; padding: 4px 6px 0; }
.axis div { position: relative; height: 16px; font: .7rem var(--font-mono); color: var(--muted); }
.axis span { position: absolute; transform: translateX(-50%); }
.q-grey { color: var(--q-grey); } .q-green { color: var(--q-green); } .q-yellow { color: var(--q-yellow); }
.q-orange { color: var(--q-orange); } .q-red { color: var(--q-red); }

/* Tarjetas del inicio */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.card.wide { grid-column: 1 / -1; }
.card h3 { font-size: 1.25rem; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h3 a { font: 600 .8rem var(--font-body); text-decoration: none; white-space: nowrap; }
.card .sub { font-size: .78rem; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.card p { margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: .93rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.pill { display: inline-block; font: 700 .7rem var(--font-mono); padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; vertical-align: 1px; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: .9rem; }
.chip.no { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
.chip.si { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.ladder { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.ladder li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: .95rem; }
.ladder .n { font: 600 .8rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ladder li.cur .n { color: var(--accent); }
.ladder li.cur { font-weight: 600; }
.ladder li.past { color: var(--muted); }
.big { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.15; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.next { border-top: 1px dashed var(--line); padding-top: 10px; font-size: .92rem; }
.next .sub { display: block; margin-bottom: 2px; }
details.sec { border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
details.sec > summary { cursor: pointer; padding: 10px 14px; font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; list-style: none; display: flex; gap: 10px; align-items: center; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: "▸"; color: var(--accent); transition: transform .15s; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > .prose { padding: 0 16px 14px; }

/* ---------- Texto de la guía ---------- */
.page-head { margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 22px; }
.toc button { background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 3px 12px; font: 600 .82rem var(--font-body); cursor: pointer; }
.toc button:hover { color: var(--fg); border-color: var(--accent); }
.toc button.on { color: var(--accent); border-color: var(--accent); }
.prose { max-width: 78ch; }
.prose > * + * { margin-top: .8em; }
.prose p, .prose li { color: color-mix(in srgb, var(--fg) 88%, var(--muted)); }
.prose ul, .prose ol { padding-left: 1.3em; margin-block: .6em; }
.prose li + li { margin-top: .25em; }
.prose li > ul, .prose li > ol { margin-block: .3em; }
.prose li::marker { color: var(--accent); }
.prose h3 { font-size: 1.3rem; margin-top: 1.4em; }
.prose h4 { font-size: 1.1rem; margin-top: 1.2em; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin-block: 2em; }
.prose blockquote { margin: 1em 0; padding: 10px 16px; border-left: 3px solid var(--rust); background: color-mix(in srgb, var(--rust) 9%, var(--surface)); border-radius: 0 8px 8px 0; }
.prose blockquote p { margin: 0; }
.prose code { font: .85em var(--font-mono); background: var(--surface-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 4px; }
.prose a.ext { font-size: .9em; }
.doc-sec { padding-top: 26px; scroll-margin-top: 80px; }
.doc-sec > h2 { font-size: 1.7rem; padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.doc-sec.here > h2 { border-bottom-color: var(--accent); }
.doc-sec.here > h2::after { content: "tu nivel"; margin-left: 12px; vertical-align: middle; font: 700 .68rem var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); padding: 2px 8px; border-radius: 999px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; }
.prose .tbl { max-width: none; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th { text-align: left; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:first-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.past td { color: var(--muted); }
tr.past td strong { color: var(--muted); }
tr.now td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
tr.now td:first-child { box-shadow: inset 3px 0 0 var(--accent); color: var(--accent); font-weight: 700; }
.code { position: relative; }
.code pre { margin: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font: .85rem/1.55 var(--font-mono); }
.code pre code { background: none; border: 0; padding: 0; }
.copy { position: absolute; top: 8px; right: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; font: 600 .75rem var(--font-body); padding: 3px 9px; cursor: pointer; }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.way {
  font: 600 .8em var(--font-mono); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 5px; padding: 0 6px; cursor: pointer; white-space: nowrap;
}
.way::before { content: "⌖ "; }
.way:hover { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: .88rem; font-weight: 600; z-index: 20;
}
.gaps { border-color: color-mix(in srgb, var(--rust) 45%, var(--line)); }
.gaps h3 { color: var(--rust); }

/* ---------- Móvil ---------- */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-block: 14px 10px; padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .nav a { white-space: nowrap; flex: none; }
  .nav .grp, .side-foot .built { display: none; }
  .side-foot { flex-direction: row; margin: 0; }
  .side { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .side .nav { grid-column: 1 / -1; grid-row: 2; }
  .hero { grid-template-columns: 1fr; gap: 18px; }
  .crest { width: 92px; height: 92px; }
  .crest b { font-size: 2.5rem; }
  .trow, .axis { grid-template-columns: 112px minmax(0, 1fr); gap: 8px; }
  .trow .tl small { display: none; }
  .lvl input[type=range] { width: 100px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- Lineup ---------- */
:root {
  --t-zona: #74c6cb; --t-entrenar: #e3a93b; --t-talento: #b77bf0; --t-mascota: #5fcf6a; --t-arma: #4f9cf0;
  --t-comprar: #e8cb2e; --t-mazmorra: #ff8b2b; --t-mision: #f2d77a; --t-profesion: #9ab8b0; --t-sistema: #8fa3c8;
  --t-ojo: #ff6b5e; --t-saltar: #7d8786;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --t-zona: #17707a; --t-entrenar: #9a5f00; --t-talento: #7a2fc2; --t-mascota: #23862d; --t-arma: #1658b8;
    --t-comprar: #8a6d00; --t-mazmorra: #b85200; --t-mision: #7c6400; --t-profesion: #4c6b63; --t-sistema: #43588a;
    --t-ojo: #c62a22; --t-saltar: #7b8281;
  }
}
:root[data-theme="light"] {
  --t-zona: #17707a; --t-entrenar: #9a5f00; --t-talento: #7a2fc2; --t-mascota: #23862d; --t-arma: #1658b8;
  --t-comprar: #8a6d00; --t-mazmorra: #b85200; --t-mision: #7c6400; --t-profesion: #4c6b63; --t-sistema: #43588a;
  --t-ojo: #c62a22; --t-saltar: #7b8281;
}
.lu-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: end; margin-bottom: 22px; }
.lu-title { display: flex; flex-direction: column; gap: 6px; }
.lu-title h1 { font-size: clamp(2rem, 4.5vw, 2.8rem); }
.prog { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; max-width: 360px; }
.prog i { display: block; height: 100%; background: var(--accent); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; grid-column: 1 / -1; }
.tabs button {
  background: var(--surface); border: 1px solid var(--line); color: var(--muted); border-radius: 8px;
  padding: 6px 12px; font: 700 .95rem var(--font-display); cursor: pointer; display: flex; gap: 8px; align-items: baseline;
}
.tabs button small { font: 600 .72rem var(--font-mono); opacity: .8; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.tabs button.has-me:not([aria-selected="true"]) { border-color: var(--accent); color: var(--accent); }
.hide-done { font-size: .88rem; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; grid-row: 1; grid-column: 2; }
.hide-done input { accent-color: var(--accent); }

c/strong>\u003c/li>\u003cli>\u003cstrong>Qué fue bien y qué cambiaría en la próxima partida:\u003c/strong>\u003c/li>\u003c/ul>","text":"Fecha en que llegó a 60: Tiempo jugado (/played): Oro total: Equipo completo, pieza por pieza: Mascota final y habilidades: Talentos finales y segunda especialización: Profesiones y niveles: Reputaciones: Montura: Puntos y perks de Legacy: Qué fue bien y qué cambiaría en la próxima partida:","range":null}]},"ruta":{"title":"Ruta de leveo 1-60: Troll Hunter (Horda) en WoW Forever","intro":"\u003cp>La ruta sigue sobre todo \u003cstrong>Kalimdor\u003c/strong>, con salidas a Eastern Kingdoms cuando compensa. Las coordenadas están en formato \u003ccode>/way\u003c/code> y sirven con TomTom (ver \u003ca href=\"#addons\">Addons\u003c/a>).\u003c/p>","sections":[{"title":"Reglas generales","titleHtml":"Reglas generales","slug":"reglas-generales","html":"\u003cul>\u003cli>\u003cstrong>Haz las misiones de tu nivel.\u003c/strong> Las grises (5 o más niveles por debajo) dan muy poca experiencia, y los enemigos grises no dan nada. Si una zona se queda sin misiones, cambia de zona; no te atasques en una misión difícil.\u003c/li>\u003cli>\u003cstrong>Combina misiones.\u003c/strong> Coge todas las de un hub antes de salir y completa los objetivos cercanos en el mismo viaje.\u003c/li>\u003cli>\u003cstrong>Recoge las misiones de una mazmorra antes de entrar.\u003c/strong> En Forever, los enemigos de mazmorra dan menos experiencia y las misiones de mazmorra dan más. Haz cada mazmorra \u003cstrong>una sola vez\u003c/strong>, con todas sus misiones. Si un miembro del grupo está más de 12 niveles por encima, los enemigos no dan experiencia.\u003c/li>\u003cli>\u003cstrong>Desbloquea todos los puntos de vuelo\u003c/strong> que pases.\u003c/li>\u003cli>\u003cstrong>Termina cada sesión descansando\u003c/strong> (rested), en una posada o una capital, o con Cozy Sleeping Bag y Camp Tent. Ver \u003ca href=\"#sistemas\">Sistemas Forever\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Usa siempre el buff de comida\u003c/strong> (Well Fed: +5 % de experiencia por muerte).\u003c/li>\u003cli>\u003cstrong>Recoge los libros de biblioteca\u003c/strong> que encuentres. Con 25 entregados consigues Truthseeker's Bow a nivel 40 (ver \u003ca href=\"#armas\">Armas y equipo\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Reino PvP:\u003c/strong> Stonetalon, Ashenvale, Hillsbrad, Stranglethorn, Desolace, Tanaris y Feralas son zonas disputadas. Ve igualmente. Si hay un grupo de Alianza acampando, pasa a la alternativa del tramo y vuelve más tarde.\u003c/li>\u003c/ul>","text":"Haz las misiones de tu nivel. Las grises (5 o más niveles por debajo) dan muy poca experiencia, y los enemigos grises no dan nada. Si una zona se queda sin misiones, cambia de zona; no te atasques en una misión difícil. Combina misiones. Coge todas las de un hub antes de salir y completa los objetivos cercanos en el mismo viaje. Recoge las misiones de una mazmorra antes de entrar. En Forever, los enemigos de mazmorra dan menos experiencia y las misiones de mazmorra dan más. Haz cada mazmorra una sola vez, con todas sus misiones. Si un miembro del grupo está más de 12 niveles por encima, los enemigos no dan experiencia. Desbloquea todos los puntos de vuelo que pases. Termina cada sesión descansando (rested), en una posada o una capital, o con Cozy Sleeping Bag y Camp Tent. Ver sistemas-forever.md. Usa siempre el buff de comida (Well Fed: +5 % de experiencia por muerte). Recoge los libros de biblioteca que encuentres. Con 25 entregados consigues Truthseeker's Bow a nivel 40 (ver armas-equipo.md). Reino PvP: Stonetalon, Ashenvale, Hillsbrad, Stranglethorn, Desolace, Tanaris y Feralas son zonas disputadas. Ve igualmente. Si hay un grupo de Alianza acampando, pasa a la alternativa del tramo y vuelve más tarde.","range":null},{"title":"Resumen","titleHtml":"Resumen","slug":"resumen","html":"\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nivel\u003c/th>\u003cth>Zona principal\u003c/th>\u003cth>Alternativa\u003c/th>\u003cth>Mazmorra\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1-10\u003c/td>\u003ctd>Durotar\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10-20\u003c/td>\u003ctd>The Barrens\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18-22\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003cstrong>Wailing Caverns\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20-25\u003c/td>\u003ctd>Stonetalon Mountains → Ashenvale\u003c/td>\u003ctd>Hillsbrad Foothills\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25-27\u003c/td>\u003ctd>The Barrens (vuelta)\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>25-32\u003c/td>\u003ctd>Thousand Needles\u003c/td>\u003ctd>Hillsbrad Foothills\u003c/td>\u003ctd>\u003cstrong>Razorfen Kraul\u003c/strong> (29-31)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30-36\u003c/td>\u003ctd>Stranglethorn Vale (1.ª visita) + Desolace\u003c/td>\u003ctd>Arathi Highlands\u003c/td>\u003ctd>Scarlet Monastery (opcional)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>36-38\u003c/td>\u003ctd>Badlands (Broken Tooth)\u003c/td>\u003ctd>Dustwallow Marsh\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>38-44\u003c/td>\u003ctd>\u003cstrong>Riverglades\u003c/strong> (zona nueva)\u003c/td>\u003ctd>Stranglethorn Vale (2.ª/3.ª visita), Dustwallow Marsh\u003c/td>\u003ctd>\u003cstrong>Krol'dok Stronghold\u003c/strong> (40-45)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>44-48\u003c/td>\u003ctd>Tanaris\u003c/td>\u003ctd>The Hinterlands\u003c/td>\u003ctd>\u003cstrong>Zul'Farrak\u003c/strong> (44-48)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>46-50\u003c/td>\u003ctd>Feralas\u003c/td>\u003ctd>Azshara, Searing Gorge\u003c/td>\u003ctd>\u003cstrong>Maraudon\u003c/strong> (46-50)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>50-54\u003c/td>\u003ctd>Un'Goro Crater → Felwood\u003c/td>\u003ctd>Burning Steppes\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>54-58\u003c/td>\u003ctd>Western Plaguelands → Eastern Plaguelands\u003c/td>\u003ctd>Silithus\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>56-60\u003c/td>\u003ctd>Winterspring\u003c/td>\u003ctd>Silithus, Burning Steppes\u003c/td>\u003ctd>\u003cstrong>Lower Blackrock Spire\u003c/strong> (Blackcrow)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>","text":"Nivel Zona principal Alternativa Mazmorra Durotar — — The Barrens — — — — Wailing Caverns Stonetalon Mountains → Ashenvale Hillsbrad Foothills — The Barrens (vuelta) — — Thousand Needles Hillsbrad Foothills Razorfen Kraul (29-31) Stranglethorn Vale (1.ª visita) + Desolace Arathi Highlands Scarlet Monastery (opcional) Badlands (Broken Tooth) Dustwallow Marsh — Riverglades (zona nueva) Stranglethorn Vale (2.ª/3.ª visita), Dustwallow Marsh Krol'dok Stronghold (40-45) Tanaris The Hinterlands Zul'Farrak (44-48) Feralas Azshara, Searing Gorge Maraudon (46-50) Un'Goro Crater → Felwood Burning Steppes — Western Plaguelands → Eastern Plaguelands Silithus — Winterspring Silithus, Burning Steppes Lower Blackrock Spire (Blackcrow)","range":null},{"title":"1-10 · Durotar","titleHtml":"1-10 · Durotar","slug":"1-10-durotar","html":"\u003cp>\u003cstrong>Ruta:\u003c/strong> Valley of Trials → Sen'jin Village → Razor Hill (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Durotar 52 43\" title=\"Copiar para TomTom\">Durotar 52 43\u003c/button>).\u003c/p>\n\u003cblockquote>\u003cp>El orden de misiones viene de una guía de la versión clásica. Puede haber misiones nuevas de Forever; si aparecen, hazlas.\u003c/p>\u003c/blockquote>\n\u003col>\u003cli>\u003cstrong>Valley of Trials (1-5):\u003c/strong>\u003cul>\u003cli>Kaltunk → &quot;Your Place In The World&quot; → Gornek → &quot;Cutting Teeth&quot; (10 Mottled Boars).\u003c/li>\u003cli>&quot;Sarkoth&quot; (Hana'zua) → mata a Sarkoth → &quot;Sarkoth&quot; (parte 2).\u003c/li>\u003cli>&quot;Sting of the Scorpid&quot; (Gornek), &quot;Vile Familiars&quot; (Zureetha Fargaze), &quot;Galgar's Cactus Apple Surprise&quot; (Galgar), &quot;Lazy Peons&quot; (Foreman Thazz'ril, despierta 5 peones con Foreman's Blackjack).\u003c/li>\u003cli>&quot;Thazz'ril's Pick&quot; → Burning Blade Coven → mata a Yarrog Baneshadow (Burning Blade Medallion). Usa el hearthstone para volver.\u003c/li>\u003cli>Entrena en Jen'shan (entrenador de cazador del valle) cada vez que pases.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Sen'jin Village (5-7):\u003c/strong>\u003cul>\u003cli>&quot;A Peon's Burden&quot; (Ukor, al salir del valle).\u003c/li>\u003cli>&quot;Report to Sen'jin Village&quot; → Master Gadrin → &quot;Report to Orgnil&quot;; &quot;A Solvent Spirit&quot; (Master Vornal).\u003c/li>\u003cli>Aprende \u003cstrong>Cooking\u003c/strong> y \u003cstrong>First Aid\u003c/strong> en cuanto puedas. Ver \u003ca href=\"#profesiones\">Profesiones\u003c/a>.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Razor Hill (7-10):\u003c/strong>\u003cul>\u003cli>&quot;Report to Orgnil&quot; (Orgnil Soulscar), &quot;A Peon's Burden&quot; (Innkeeper Grosk). \u003cstrong>Pon el hearthstone en Razor Hill.\u003c/strong>\u003c/li>\u003cli>&quot;Vanquish the Betrayers&quot; (Gar'Thok), &quot;Carry Your Weight&quot; (Furl Scornbrow, torre oeste).\u003c/li>\u003cli>Tiragarde Keep (al sur): Kul Tiras Sailors/Marines, Lieutenant Benedict → &quot;The Admiral's Orders&quot;.\u003c/li>\u003cli>Aprende \u003cstrong>Skinning\u003c/strong> y desuella todo lo que mates.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Nivel 10: misión de clase.\u003c/strong> Habla con \u003cstrong>Thotar\u003c/strong> en Razor Hill (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Durotar 51.8 43.4\" title=\"Copiar para TomTom\">Durotar 51.8 43.4\u003c/button>) para empezar &quot;Taming the Beast&quot;. Doma las tres bestias de práctica (Dire Mottled Boar, Surf Crawler, Armored Scorpid) y termina &quot;Training the Beast&quot; con \u003cstrong>Ormak Grimshot\u003c/strong> en Orgrimmar (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Orgrimmar 66.2 18.2\" title=\"Copiar para TomTom\">Orgrimmar 66.2 18.2\u003c/button>).\u003cul>\u003cli>Primera mascota: \u003cstrong>Shal'ma\u003c/strong> (Cat, nivel 9) en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Durotar 61.0 88.2\" title=\"Copiar para TomTom\">Durotar 61.0 88.2\u003c/button> o \u003ccode>68.4 70.6\u003c/code>. Ver \u003ca href=\"#mascotas\">Mascotas\u003c/a>.\u003c/li>\u003cli>En Orgrimmar aprende \u003cstrong>Leatherworking\u003c/strong> y visita el entrenador de armas.\u003c/li>\u003c/ul>\u003c/li>\u003cli>Sal hacia The Barrens a \u003cstrong>nivel 10-11\u003c/strong> por el camino del oeste.\u003c/li>\u003c/ol>","text":"Ruta: Valley of Trials → Sen'jin Village → Razor Hill (/way Durotar 52 43). El orden de misiones viene de una guía de la versión clásica. Puede haber misiones nuevas de Forever; si aparecen, hazlas. Valley of Trials (1-5): Kaltunk → \"Your Place In The World\" → Gornek → \"Cutting Teeth\" (10 Mottled Boars). \"Sarkoth\" (Hana'zua) → mata a Sarkoth → \"Sarkoth\" (parte 2). \"Sting of the Scorpid\" (Gornek), \"Vile Familiars\" (Zureetha Fargaze), \"Galgar's Cactus Apple Surprise\" (Galgar), \"Lazy Peons\" (Foreman Thazz'ril, despierta 5 peones con Foreman's Blackjack). \"Thazz'ril's Pick\" → Burning Blade Coven → mata a Yarrog Baneshadow (Burning Blade Medallion). Usa el hearthstone para volver. Entrena en Jen'shan (entrenador de cazador del valle) cada vez que pases. Sen'jin Village (5-7): \"A Peon's Burden\" (Ukor, al salir del valle). \"Report to Sen'jin Village\" → Master Gadrin → \"Report to Orgnil\"; \"A Solvent Spirit\" (Master Vornal). Aprende Cooking y First Aid en cuanto puedas. Ver profesiones.md. Razor Hill (7-10): \"Report to Orgnil\" (Orgnil Soulscar), \"A Peon's Burden\" (Innkeeper Grosk). Pon el hearthstone en Razor Hill. \"Vanquish the Betrayers\" (Gar'Thok), \"Carry Your Weight\" (Furl Scornbrow, torre oeste). Tiragarde Keep (al sur): Kul Tiras Sailors/Marines, Lieutenant Benedict → \"The Admiral's Orders\". Aprende Skinning y desuella todo lo que mates. Nivel 10: misión de clase. Habla con Thotar en Razor Hill (/way Durotar 51.8 43.4) para empezar \"Taming the Beast\". Doma las tres bestias de práctica (Dire Mottled Boar, Surf Crawler, Armored Scorpid) y termina \"Training the Beast\" con Ormak Grimshot en Orgrimmar (/way Orgrimmar 66.2 18.2). Primera mascota: Shal'ma (Cat, nivel 9) en /way Durotar 61.0 88.2 o 68.4 70.6. Ver mascotas.md. En Orgrimmar aprende Leatherworking y visita el entrenador de armas. Sal hacia The Barrens a nivel 10-11 por el camino del oeste.","range":[1,10]},{"title":"10-20 · The Barrens","titleHtml":"10-20 · The Barrens","slug":"10-20-the-barrens","html":"\u003cp>\u003cstrong>Hub:\u003c/strong> The Crossroads (punto de vuelo de Devrak en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way The Barrens 51.5 30.3\" title=\"Copiar para TomTom\">The Barrens 51.5 30.3\u003c/button>; posada de Innkeeper Boorand Plainswind). \u003cstrong>Hearthstone en Crossroads hasta nivel 19\u003c/strong>; después, en Camp Taurajo.\u003c/p>\n\u003col>\u003cli>\u003cstrong>10-14: Crossroads, Forgotten Pools y Ratchet.\u003c/strong>\u003cul>\u003cli>Plainstrider Menace, Raptor Thieves, Disrupt the Attacks, The Forgotten Pools, Fungal Spores, Centaur Bracers.\u003c/li>\u003cli>En Ratchet (punto de vuelo de Bragok): Southsea Freebooters, Samophlange, Raptor Horns, Root Samples, WANTED: Baron Longshore, Stolen Booty.\u003c/li>\u003cli>Mata \u003cstrong>Dishu\u003c/strong> (Cat 13) solo si quieres cambiar de mascota. Shal'ma sirve.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>14: Cozy Sleeping Bag.\u003c/strong> Haz clic en Burned-Out Remains (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way The Barrens 46 74\" title=\"Copiar para TomTom\">The Barrens 46 74\u003c/button>) para empezar &quot;...and that note you found&quot;. Es la cadena más rentable del leveo. Ver \u003ca href=\"#sistemas\">Sistemas Forever\u003c/a>.\u003c/li>\u003cli>\u003cstrong>14-18: norte de The Barrens, Sludge Fen y Stagnant Oasis.\u003c/strong>\u003cul>\u003cli>The Disruption Ends, Supplies for the Crossroads, Ignition, The Escape.\u003c/li>\u003cli>The Stagnant Oasis, Altered Beings, Echeyakee.\u003c/li>\u003cli>Kolkar Leaders, Verog the Dervish.\u003c/li>\u003cli>Harpy Raiders, Harpy Lieutenants.\u003c/li>\u003cli>Mankrik's wife: Beaten Corpse en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way The Barrens 49.3 50.3\" title=\"Copiar para TomTom\">The Barrens 49.3 50.3\u003c/button>.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>18-22: Camp Taurajo\u003c/strong> (punto de vuelo de Omusa Thunderhorn, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way The Barrens 44.5 59.2\" title=\"Copiar para TomTom\">The Barrens 44.5 59.2\u003c/button>).\u003cul>\u003cli>Jorn Skyseer: Enraged Thunder Lizards, Ishamuhale, Cry of the Thunderhawk, Tribes at War.\u003c/li>\u003cli>Blood Shards of Agamaggan.\u003c/li>\u003cli>Hezrul Bloodmark (elite 19, hazla en dúo a 18) y Serena Bloodfeather (20).\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Wailing Caverns a 18-22\u003c/strong> (una sola vez y con todas las misiones):\u003cul>\u003cli>Leaders of the Fang (Nara Wildmane, Thunder Bluff; recompensa a elegir), Serpentbloom (Apothecary Zamah, Thunder Bluff).\u003c/li>\u003cli>Deviate Hides, Deviate Eradication, Trouble at the Docks, The Glowing Shard.\u003c/li>\u003cli>\u003cstrong>Objetivo: Venomstrike\u003c/strong>, arco de nivel 19 que suelta Lord Serpentis.\u003c/li>\u003cli>Opcional: Leggings, Footpads y Belt of the Fang (set de cuero).\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>18-20: viaje a Westfall\u003c/strong> para el segundo paso de la Cozy Sleeping Bag (barco de Ratchet a Booty Bay). Ver \u003ca href=\"#sistemas\">Sistemas Forever\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Sáltate:\u003c/strong> The Tear of the Moons, The Swarm Grows (por ahora), Deepmoss Spider Eggs, Blueleaf Tubers y Counterattack! si vas solo.\u003c/li>\u003c/ol>","text":"Hub: The Crossroads (punto de vuelo de Devrak en /way The Barrens 51.5 30.3; posada de Innkeeper Boorand Plainswind). Hearthstone en Crossroads hasta nivel 19; después, en Camp Taurajo. : Crossroads, Forgotten Pools y Ratchet. Plainstrider Menace, Raptor Thieves, Disrupt the Attacks, The Forgotten Pools, Fungal Spores, Centaur Bracers. En Ratchet (punto de vuelo de Bragok): Southsea Freebooters, Samophlange, Raptor Horns, Root Samples, WANTED: Baron Longshore, Stolen Booty. Mata Dishu (Cat 13) solo si quieres cambiar de mascota. Shal'ma sirve. : Cozy Sleeping Bag. Haz clic en Burned-Out Remains (/way The Barrens 46 74) para empezar \"...and that note you found\". Es la cadena más rentable del leveo. Ver sistemas-forever.md. : norte de The Barrens, Sludge Fen y Stagnant Oasis. The Disruption Ends, Supplies for the Crossroads, Ignition, The Escape. The Stagnant Oasis, Altered Beings, Echeyakee. Kolkar Leaders, Verog the Dervish. Harpy Raiders, Harpy Lieutenants. Mankrik's wife: Beaten Corpse en /way The Barrens 49.3 50.3. : Camp Taurajo (punto de vuelo de Omusa Thunderhorn, /way The Barrens 44.5 59.2). Jorn Skyseer: Enraged Thunder Lizards, Ishamuhale, Cry of the Thunderhawk, Tribes at War. Blood Shards of Agamaggan. Hezrul Bloodmark (elite 19, hazla en dúo a 18) y Serena Bloodfeather (20). Wailing Caverns a 18-22 (una sola vez y con todas las misiones): Leaders of the Fang (Nara Wildmane, Thunder Bluff; recompensa a elegir), Serpentbloom (Apothecary Zamah, Thunder Bluff). Deviate Hides, Deviate Eradication, Trouble at the Docks, The Glowing Shard. Objetivo: Venomstrike, arco de nivel 19 que suelta Lord Serpentis. Opcional: Leggings, Footpads y Belt of the Fang (set de cuero). : viaje a Westfall para el segundo paso de la Cozy Sleeping Bag (barco de Ratchet a Booty Bay). Ver sistemas-forever.md. Sáltate: The Tear of the Moons, The Swarm Grows (por ahora), Deepmoss Spider Eggs, Blueleaf Tubers y Counterattack! si vas solo.","range":[10,20]},{"title":"20-25 · Stonetalon Mountains → Ashenvale","titleHtml":"20-25 · Stonetalon Mountains → Ashenvale","slug":"20-25-stonetalon-mountains-ashenvale","html":"\u003cp>\u003cstrong>Stonetalon (20-23):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Entra desde el campamento de la frontera (The Barrens 35,27). Hub: Sun Rock Retreat (punto de vuelo de Tharm en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Stonetalon Mountains 45.1 59.8\" title=\"Copiar para TomTom\">Stonetalon Mountains 45.1 59.8\u003c/button>).\u003c/li>\u003cli>Misiones: The Spirits of Stonetalon, Letter to Jin'Zil, Jin'Zil's Forest Magic, Goblin Invaders, Avenge My Village, Kill Grundig Darkcloud, Protect Kaya, Super Reaper 6000, Gerenzo's Orders, Earthen Arise (Goggeroc, elite 20; hazla a 21), Arachnophobia (Besseleth, elite 21; sola a 23).\u003c/li>\u003cli>Mejor zona para matar bichos: Windshear Crag (unos 67,52). Hay campamento de Forever ahí.\u003c/li>\u003cli>Aquí también va el paso &quot;Scramble&quot; de la Cozy Sleeping Bag, que da a elegir \u003cstrong>Precision Bow o Moonsight Rifle\u003c/strong> y 200 Feathered Arrow.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Ashenvale (22-25 y vuelta a 27-30 si hace falta):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Hubs: Splintertree Post (punto de vuelo de Vhulgra, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Ashenvale 73.2 61.6\" title=\"Copiar para TomTom\">Ashenvale 73.2 61.6\u003c/button>) y Zoram'gar Outpost (Andruk, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Ashenvale 12.2 33.8\" title=\"Copiar para TomTom\">Ashenvale 12.2 33.8\u003c/button>).\u003c/li>\u003cli>Misiones: The Ashenvale Hunt (coge solo un mensajero), Satyr Horns, Ashenvale Outrunners, Torek's Assault (escolta, hazla), Warsong Scout Update, The Befouled Element, Ursangous's Paw, Freedom to Ruul, Je'neu of the Earthen Ring, Between a Rock and a Thistlefur, The Hunt Completed (Wildhunter Cloak).\u003c/li>\u003cli>Mist Howler (Wolf 22, Furious Howl) en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Ashenvale 26.8 18.4\" title=\"Copiar para TomTom\">Ashenvale 26.8 18.4\u003c/button>. Solo si quieres el lobo; ver \u003ca href=\"#mascotas\">Mascotas\u003c/a>.\u003c/li>\u003cli>Sáltate: The Howling Vale, Warsong Saw Blades/Supplies (piden Deadly Blunderbuss) y Sharptalon's Claw antes de 29.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Alternativa:\u003c/strong> Hillsbrad Foothills (20-30), hub en Tarren Mill (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Hillsbrad Foothills 62 20\" title=\"Copiar para TomTom\">Hillsbrad Foothills 62 20\u003c/button>). Desde Orgrimmar se va en zepelín a Undercity y luego por Silverpine Forest. Es zona muy disputada.\u003c/p>\n\u003cp>\u003cstrong>A 23-25: viaje a Loch Modan y Hillsbrad\u003c/strong> para terminar la Cozy Sleeping Bag. Ver \u003ca href=\"#sistemas\">Sistemas Forever\u003c/a>.\u003c/p>","text":"Stonetalon (20-23): Entra desde el campamento de la frontera (The Barrens 35,27). Hub: Sun Rock Retreat (punto de vuelo de Tharm en /way Stonetalon Mountains 45.1 59.8). Misiones: The Spirits of Stonetalon, Letter to Jin'Zil, Jin'Zil's Forest Magic, Goblin Invaders, Avenge My Village, Kill Grundig Darkcloud, Protect Kaya, Super Reaper 6000, Gerenzo's Orders, Earthen Arise (Goggeroc, elite 20; hazla a 21), Arachnophobia (Besseleth, elite 21; sola a 23). Mejor zona para matar bichos: Windshear Crag (unos 67,52). Hay campamento de Forever ahí. Aquí también va el paso \"Scramble\" de la Cozy Sleeping Bag, que da a elegir Precision Bow o Moonsight Rifle y 200 Feathered Arrow. Ashenvale (22-25 y vuelta a 27-30 si hace falta): Hubs: Splintertree Post (punto de vuelo de Vhulgra, /way Ashenvale 73.2 61.6) y Zoram'gar Outpost (Andruk, /way Ashenvale 12.2 33.8). Misiones: The Ashenvale Hunt (coge solo un mensajero), Satyr Horns, Ashenvale Outrunners, Torek's Assault (escolta, hazla), Warsong Scout Update, The Befouled Element, Ursangous's Paw, Freedom to Ruul, Je'neu of the Earthen Ring, Between a Rock and a Thistlefur, The Hunt Completed (Wildhunter Cloak). Mist Howler (Wolf 22, Furious Howl) en /way Ashenvale 26.8 18.4. Solo si quieres el lobo; ver mascotas.md. Sáltate: The Howling Vale, Warsong Saw Blades/Supplies (piden Deadly Blunderbuss) y Sharptalon's Claw antes de 29. Alternativa: Hillsbrad Foothills (20-30), hub en Tarren Mill (/way Hillsbrad Foothills 62 20). Desde Orgrimmar se va en zepelín a Undercity y luego por Silverpine Forest. Es zona muy disputada. A 23-25: viaje a Loch Modan y Hillsbrad para terminar la Cozy Sleeping Bag. Ver sistemas-forever.md.","range":[20,25]},{"title":"25-27 · Vuelta a The Barrens","titleHtml":"25-27 · Vuelta a The Barrens","slug":"25-27-vuelta-a-the-barrens","html":"\u003cul>\u003cli>Mahren Skyseer, Isha Awak, Weapons of Choice, Revenge of Gann (Totemic Clan Ring).\u003c/li>\u003cli>Sigue al sur por The Great Lift hacia Thousand Needles.\u003c/li>\u003c/ul>","text":"Mahren Skyseer, Isha Awak, Weapons of Choice, Revenge of Gann (Totemic Clan Ring). Sigue al sur por The Great Lift hacia Thousand Needles.","range":[25,27]},{"title":"25-32 · Thousand Needles + Razorfen Kraul","titleHtml":"25-32 · Thousand Needles + Razorfen Kraul","slug":"25-32-thousand-needles-razorfen-kraul","html":"\u003cp>\u003cstrong>Thousand Needles:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Hub: Freewind Post (wind rider Nyse en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Thousand Needles 45.1 49.1\" title=\"Copiar para TomTom\">Thousand Needles 45.1 49.1\u003c/button>). \u003cstrong>Pon el hearthstone aquí.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>Cañón (26-30):\u003c/strong> Pacify the Centaur, Alien Egg, Wind Rider, Wanted - Arnak Grimtotem, Serpent Wild, Protect Kanati Greycloud, Grimtotem Spying, Free at Last, Arikara, Test of Faith/Endurance/Strength.\u003c/li>\u003cli>\u003cstrong>The Shimmering Flats (30-35):\u003c/strong> Rocket Car Parts, Salt Flat Venom, Hardened Shells, A Bump in the Road, Hypercapacitor Gizmo (elite 30; sola a 32).\u003c/li>\u003cli>Sáltate: Goblin Sponsorship y Test of Lore (salvo que vayas a hacer Scarlet Monastery).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Razorfen Kraul a 29-31:\u003c/strong> misión \u003cstrong>Vengeful Fate\u003c/strong> → \u003cstrong>Quilboar Blaster\u003c/strong> (rifle de nivel 29, Horda).\u003c/p>","text":"Thousand Needles: Hub: Freewind Post (wind rider Nyse en /way Thousand Needles 45.1 49.1). Pon el hearthstone aquí. Cañón (26-30): Pacify the Centaur, Alien Egg, Wind Rider, Wanted - Arnak Grimtotem, Serpent Wild, Protect Kanati Greycloud, Grimtotem Spying, Free at Last, Arikara, Test of Faith/Endurance/Strength. The Shimmering Flats (30-35): Rocket Car Parts, Salt Flat Venom, Hardened Shells, A Bump in the Road, Hypercapacitor Gizmo (elite 30; sola a 32). Sáltate: Goblin Sponsorship y Test of Lore (salvo que vayas a hacer Scarlet Monastery). Razorfen Kraul a 29-31: misión Vengeful Fate → Quilboar Blaster (rifle de nivel 29, Horda).","range":[25,32]},{"title":"30-36 · Stranglethorn Vale (1.ª visita) + Desolace","titleHtml":"30-36 · Stranglethorn Vale (1.ª visita) + Desolace","slug":"30-36-stranglethorn-vale-1-visita-desolace","html":"\u003cp>\u003cstrong>Stranglethorn (30-34):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Zepelín de Orgrimmar a Grom'gol Base Camp (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Stranglethorn Vale 32.2 29.0\" title=\"Copiar para TomTom\">Stranglethorn Vale 32.2 29.0\u003c/button>; punto de vuelo de Thysta).\u003c/li>\u003cli>Nesingwary's Expedition (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Stranglethorn Vale 35.6 10.6\" title=\"Copiar para TomTom\">Stranglethorn Vale 35.6 10.6\u003c/button>): \u003cstrong>Welcome to the Jungle\u003c/strong> (no te la saltes) y Tiger Mastery, Panther Mastery y Raptor Mastery de nivel 1.\u003c/li>\u003cli>Grom'gol: Hunt for Yenniku, Bloody Bone Necklaces, The Defense of Grom'gol.\u003c/li>\u003cli>Booty Bay: misiones de recolección. Lleva las páginas de The Green Hills of Stranglethorn que caigan.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Desolace (32-38):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Hub: Shadowprey Village (punto de vuelo de Thalon en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Desolace 21.6 74.1\" title=\"Copiar para TomTom\">Desolace 21.6 74.1\u003c/button>). Ghost Walker Post no tiene posada.\u003c/li>\u003cli>Elige el clan \u003cstrong>Gelkis\u003c/strong>: Raid on the Kolkar, Stealing Supplies, Khan Jehn y Khan Hratha (elite 42; déjala para luego).\u003c/li>\u003cli>Misiones: Kodo Roundup, Bone Collector, Ghost-o-plasm Round Up, Gizelton Caravan (Sidegunner Shottie; en dúo o sola a 39), Book of the Ancients, The Burning of Spirits, Befouled by Satyr, Clam Bait / Other Fish to Fry.\u003c/li>\u003cli>Mejor zona para matar bichos a 38-40: Mannoroc Coven (51.6, 84.3). Para Skinning: Kodo Graveyard.\u003c/li>\u003cli>\u003cstrong>Deja en el registro\u003c/strong> las misiones de Maraudon (Centaur Pariah, Legends of Maraudon, Corruption of Earth and Seed, Vyletongue Corruption).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Alternativa:\u003c/strong> Arathi Highlands (30-40), hub en Hammerfall (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Arathi Highlands 74 34\" title=\"Copiar para TomTom\">Arathi Highlands 74 34\u003c/button>): Call to Arms, Foul Magics, Raising Spirits, Guile of the Raptor. También Doctor Gregory Victor (Triage, First Aid Artisan).\u003c/p>","text":"Stranglethorn (30-34): Zepelín de Orgrimmar a Grom'gol Base Camp (/way Stranglethorn Vale 32.2 29.0; punto de vuelo de Thysta). Nesingwary's Expedition (/way Stranglethorn Vale 35.6 10.6): Welcome to the Jungle (no te la saltes) y Tiger Mastery, Panther Mastery y Raptor Mastery de nivel 1. Grom'gol: Hunt for Yenniku, Bloody Bone Necklaces, The Defense of Grom'gol. Booty Bay: misiones de recolección. Lleva las páginas de The Green Hills of Stranglethorn que caigan. Desolace (32-38): Hub: Shadowprey Village (punto de vuelo de Thalon en /way Desolace 21.6 74.1). Ghost Walker Post no tiene posada. Elige el clan Gelkis: Raid on the Kolkar, Stealing Supplies, Khan Jehn y Khan Hratha (elite 42; déjala para luego). Misiones: Kodo Roundup, Bone Collector, Ghost-o-plasm Round Up, Gizelton Caravan (Sidegunner Shottie; en dúo o sola a 39), Book of the Ancients, The Burning of Spirits, Befouled by Satyr, Clam Bait / Other Fish to Fry. Mejor zona para matar bichos a 38-40: Mannoroc Coven (51.6, 84.3). Para Skinning: Kodo Graveyard. Deja en el registro las misiones de Maraudon (Centaur Pariah, Legends of Maraudon, Corruption of Earth and Seed, Vyletongue Corruption). Alternativa: Arathi Highlands (30-40), hub en Hammerfall (/way Arathi Highlands 74 34): Call to Arms, Foul Magics, Raising Spirits, Guile of the Raptor. También Doctor Gregory Victor (Triage, First Aid Artisan).","range":[30,36]},{"title":"36-38 · Badlands","titleHtml":"36-38 · Badlands","slug":"36-38-badlands","html":"\u003cul>\u003cli>Hub: Kargath (punto de vuelo de Gorrik en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Badlands 4.0 44.8\" title=\"Copiar para TomTom\">Badlands 4.0 44.8\u003c/button>).\u003c/li>\u003cli>\u003cstrong>Doma a Broken Tooth\u003c/strong> (Cat 37, ataque cada 1,0 s), en \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Badlands 52.8 28.4\" title=\"Copiar para TomTom\">Badlands 52.8 28.4\u003c/button> o \u003ccode>25.8 48.6\u003c/code>. Reaparece cada 7-8 horas. Será tu mascota hasta 60. Ver \u003ca href=\"#mascotas\">Mascotas\u003c/a>.\u003c/li>\u003cli>Misiones: Badlands Reagent Run, Coyote Thieves, la cadena del collar de la Horda (Necklace Recovery), la cadena de Lotwil Veriatus y Rigglefuzz (Barbecued Buzzard Wings, Power Stones).\u003c/li>\u003cli>Sáltate: Pearl Diving, Indurium, Summoning the Princess, Badlands Reagent Run II y las misiones de Kargath de nivel 48+.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Alternativa:\u003c/strong> Dustwallow Marsh (36-40), hub en Brackenwall Village (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Dustwallow Marsh 35 30\" title=\"Copiar para TomTom\">Dustwallow Marsh 35 30\u003c/button>). Questioning Reethe da a elegir \u003cstrong>Blasting Hackbut\u003c/strong> (rifle).\u003c/p>","text":"Hub: Kargath (punto de vuelo de Gorrik en /way Badlands 4.0 44.8). Doma a Broken Tooth (Cat 37, ataque cada 1,0 s), en /way Badlands 52.8 28.4 o 25.8 48.6. Reaparece cada 7-8 horas. Será tu mascota hasta 60. Ver mascotas.md. Misiones: Badlands Reagent Run, Coyote Thieves, la cadena del collar de la Horda (Necklace Recovery), la cadena de Lotwil Veriatus y Rigglefuzz (Barbecued Buzzard Wings, Power Stones). Sáltate: Pearl Diving, Indurium, Summoning the Princess, Badlands Reagent Run II y las misiones de Kargath de nivel 48+. Alternativa: Dustwallow Marsh (36-40), hub en Brackenwall Village (/way Dustwallow Marsh 35 30). Questioning Reethe da a elegir Blasting Hackbut (rifle).","range":[36,38]},{"title":"38-44 · Riverglades (zona nueva) + Krol'dok Stronghold","titleHtml":"38-44 · Riverglades (zona nueva) + Krol'dok Stronghold","slug":"38-44-riverglades-zona-nueva-krol-dok-stronghold","html":"\u003cul>\u003cli>\u003cstrong>Cómo llegar:\u003c/strong> barco de Steamwheedle Port, Tanaris (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Tanaris 67 23\" title=\"Copiar para TomTom\">Tanaris 67 23\u003c/button>), a Powderfuse Port (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Riverglades 78 53\" title=\"Copiar para TomTom\">Riverglades 78 53\u003c/button>). Luego sigue la carretera hasta \u003cstrong>Rog'mar\u003c/strong> (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Riverglades 59 45\" title=\"Copiar para TomTom\">Riverglades 59 45\u003c/button>), la base de la Horda. Según games.gg, también hay vuelos a Rog'mar desde Stonard, Kargath, Flame Crest y Hammerfall.\u003c/li>\u003cli>Tiene más de 150 misiones nuevas. Haz todas las de Rog'mar y sus hubs. \u003cstrong>Aquí todavía no hay guía con nombres de misiones\u003c/strong>: el agente debe ir apuntando lo que encuentre el usuario.\u003c/li>\u003cli>Bloodmasters Ring: desafío de grupo al aire libre, en territorio de ogros.\u003c/li>\u003cli>\u003cstrong>Krol'dok Stronghold (40-45):\u003c/strong> mazmorra nueva de ogros. Coge todas sus misiones antes de entrar.\u003c/li>\u003cli>\u003cstrong>A 41-43, vuelve a Stranglethorn:\u003c/strong> Big Game Hunter (King Bangalash, tigre elite 43; en grupo o con buena mascota) da \u003cstrong>Master Hunter's Bow o Master Hunter's Rifle\u003c/strong>. Termina también Tiger, Panther y Raptor Mastery.\u003c/li>\u003c/ul>","text":"Cómo llegar: barco de Steamwheedle Port, Tanaris (/way Tanaris 67 23), a Powderfuse Port (/way Riverglades 78 53). Luego sigue la carretera hasta Rog'mar (/way Riverglades 59 45), la base de la Horda. Según games.gg, también hay vuelos a Rog'mar desde Stonard, Kargath, Flame Crest y Hammerfall. Tiene más de 150 misiones nuevas. Haz todas las de Rog'mar y sus hubs. Aquí todavía no hay guía con nombres de misiones: el agente debe ir apuntando lo que encuentre el usuario. Bloodmasters Ring: desafío de grupo al aire libre, en territorio de ogros. Krol'dok Stronghold (40-45): mazmorra nueva de ogros. Coge todas sus misiones antes de entrar. A 41-43, vuelve a Stranglethorn: Big Game Hunter (King Bangalash, tigre elite 43; en grupo o con buena mascota) da Master Hunter's Bow o Master Hunter's Rifle. Termina también Tiger, Panther y Raptor Mastery.","range":[38,44]},{"title":"44-48 · Tanaris + Zul'Farrak","titleHtml":"44-48 · Tanaris + Zul'Farrak","slug":"44-48-tanaris-zul-farrak","html":"\u003cul>\u003cli>Hubs: Gadgetzan (punto de vuelo de Bulkrek Ragefist, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Tanaris 51.6 25.4\" title=\"Copiar para TomTom\">Tanaris 51.6 25.4\u003c/button>) y Steamwheedle Port.\u003c/li>\u003cli>Las primeras misiones aparecen a 40; a 42-43 se va cómodo.\u003c/li>\u003cli>\u003cstrong>Zul'Farrak (44-48):\u003c/strong> Arch of the Covenant (arco 42). Lleva Gahz'rilla (Thousand Needles) y Screecher Spirits (Feralas).\u003c/li>\u003cli>Alternativa: The Hinterlands (46-50), Revantusk Village (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way The Hinterlands 78 81\" title=\"Copiar para TomTom\">The Hinterlands 78 81\u003c/button>).\u003c/li>\u003c/ul>","text":"Hubs: Gadgetzan (punto de vuelo de Bulkrek Ragefist, /way Tanaris 51.6 25.4) y Steamwheedle Port. Las primeras misiones aparecen a 40; a 42-43 se va cómodo. Zul'Farrak (44-48): Arch of the Covenant (arco 42). Lleva Gahz'rilla (Thousand Needles) y Screecher Spirits (Feralas). Alternativa: The Hinterlands (46-50), Revantusk Village (/way The Hinterlands 78 81).","range":[44,48]},{"title":"46-50 · Feralas + Maraudon","titleHtml":"46-50 · Feralas + Maraudon","slug":"46-50-feralas-maraudon","html":"\u003cul>\u003cli>Hub: Camp Mojache (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Feralas 75 44\" title=\"Copiar para TomTom\">Feralas 75 44\u003c/button>).\u003c/li>\u003cli>Misiones: War on the Woodpaw, Alpha Strike, The Ogres of Feralas, Zukk'ash Infestation, Stinglasher (a 47), la cadena de los Muisek (A Strange Request → Weapons of Spirit), Zapped Giants + Fuel for the Zapping, Improved Quality (Jangdor's Handcrafted Tunic, cuero) y The Battle Plans.\u003c/li>\u003cli>Mejor zona para matar bichos: la cueva de yetis Feral Scar (55,56) a 43-46; da Thick Leather.\u003c/li>\u003cli>Sáltate: el Isle of Dread y Dark Heart antes de 49.\u003c/li>\u003cli>\u003cstrong>Maraudon (46-50):\u003c/strong> Corruption of Earth and Seed → \u003cstrong>Verdant Keeper's Aim\u003c/strong> (arco 45); Megashot Rifle (48) cae dentro.\u003c/li>\u003c/ul>","text":"Hub: Camp Mojache (/way Feralas 75 44). Misiones: War on the Woodpaw, Alpha Strike, The Ogres of Feralas, Zukk'ash Infestation, Stinglasher (a 47), la cadena de los Muisek (A Strange Request → Weapons of Spirit), Zapped Giants + Fuel for the Zapping, Improved Quality (Jangdor's Handcrafted Tunic, cuero) y The Battle Plans. Mejor zona para matar bichos: la cueva de yetis Feral Scar (55,56) a 43-46; da Thick Leather. Sáltate: el Isle of Dread y Dark Heart antes de 49. Maraudon (46-50): Corruption of Earth and Seed → Verdant Keeper's Aim (arco 45); Megashot Rifle (48) cae dentro.","range":[46,50]},{"title":"50-54 · Un'Goro Crater → Felwood","titleHtml":"50-54 · Un'Goro Crater → Felwood","slug":"50-54-un-goro-crater-felwood","html":"\u003cul>\u003cli>\u003cstrong>Un'Goro (50-53):\u003c/strong> entra desde Tanaris y desbloquea primero Marshal's Refuge (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Un'Goro Crater 45 6\" title=\"Copiar para TomTom\">Un'Goro Crater 45 6\u003c/button>). Cuidado con los dinosaurios que patrullan.\u003c/li>\u003cli>\u003cstrong>Felwood (52-54):\u003c/strong> entra desde Ashenvale y empieza en Emerald Sanctuary (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Felwood 51 82\" title=\"Copiar para TomTom\">Felwood 51 82\u003c/button>). Sube hacia el norte; necesitas reputación con los del túnel norte para pasar a Winterspring.\u003c/li>\u003cli>Alternativa: Burning Steppes (52-58), hub en Flame Crest (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Burning Steppes 65 24\" title=\"Copiar para TomTom\">Burning Steppes 65 24\u003c/button>).\u003c/li>\u003c/ul>","text":"Un'Goro (50-53): entra desde Tanaris y desbloquea primero Marshal's Refuge (/way Un'Goro Crater 45 6). Cuidado con los dinosaurios que patrullan. Felwood (52-54): entra desde Ashenvale y empieza en Emerald Sanctuary (/way Felwood 51 82). Sube hacia el norte; necesitas reputación con los del túnel norte para pasar a Winterspring. Alternativa: Burning Steppes (52-58), hub en Flame Crest (/way Burning Steppes 65 24).","range":[50,54]},{"title":"54-58 · Western Plaguelands → Eastern Plaguelands","titleHtml":"54-58 · Western Plaguelands → Eastern Plaguelands","slug":"54-58-western-plaguelands-eastern-plaguelands","html":"\u003cul>\u003cli>\u003cstrong>Western Plaguelands (54-57):\u003c/strong> entra desde Undercity → The Bulwark (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Western Plaguelands 27 57\" title=\"Copiar para TomTom\">Western Plaguelands 27 57\u003c/button>). No tiene punto de vuelo de la Horda; usa Tarren Mill o Revantusk Village.\u003cul>\u003cli>The Scourge Cauldrons: Felstone Field, Dalson's Tears, Writhing Haunt y Gahrron's Withering.\u003c/li>\u003cli>All Along the Watchtowers, Locked Away (Farmer Dalson's Shotgun) y A Matter of Time.\u003c/li>\u003cli>Lleva un Argent Dawn Commission equipado y entrega Scourgestones.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Eastern Plaguelands (55-58):\u003c/strong> punto de vuelo de Georgia en Light's Hope (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Eastern Plaguelands 80.2 57.0\" title=\"Copiar para TomTom\">Eastern Plaguelands 80.2 57.0\u003c/button>).\u003cul>\u003cli>Cadena de Nathanos Blightcaller en Marris Stead: Duskwing (elite 60), The Corpulent One y The Scarlet Oracle, Demetria → \u003cstrong>Gorewood Bow\u003c/strong>.\u003c/li>\u003cli>Cadena de Darrowshire (Pamela) y Tirion Fordring.\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>","text":"Western Plaguelands (54-57): entra desde Undercity → The Bulwark (/way Western Plaguelands 27 57). No tiene punto de vuelo de la Horda; usa Tarren Mill o Revantusk Village. The Scourge Cauldrons: Felstone Field, Dalson's Tears, Writhing Haunt y Gahrron's Withering. All Along the Watchtowers, Locked Away (Farmer Dalson's Shotgun) y A Matter of Time. Lleva un Argent Dawn Commission equipado y entrega Scourgestones. Eastern Plaguelands (55-58): punto de vuelo de Georgia en Light's Hope (/way Eastern Plaguelands 80.2 57.0). Cadena de Nathanos Blightcaller en Marris Stead: Duskwing (elite 60), The Corpulent One y The Scarlet Oracle, Demetria → Gorewood Bow. Cadena de Darrowshire (Pamela) y Tirion Fordring.","range":[54,58]},{"title":"56-60 · Winterspring + Lower Blackrock Spire","titleHtml":"56-60 · Winterspring + Lower Blackrock Spire","slug":"56-60-winterspring-lower-blackrock-spire","html":"\u003cul>\u003cli>Pasa por el túnel norte de Felwood. Hub: Everlook (\u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Winterspring 61 38\" title=\"Copiar para TomTom\">Winterspring 61 38\u003c/button>).\u003c/li>\u003cli>Evita Darkwhisper Gorge y las zonas de dragones si vas solo.\u003c/li>\u003cli>\u003cstrong>Lower Blackrock Spire (55-60):\u003c/strong> \u003cstrong>Blackcrow\u003c/strong>, que suelta Shadow Hunter Vosh'gajin, es la mejor arma a distancia antes de raid.\u003c/li>\u003cli>Alternativa: Silithus (Cenarion Hold, \u003cbutton type=\"button\" class=\"way\" data-copy=\"/way Silithus 51 38\" title=\"Copiar para TomTom\">Silithus 51 38\u003c/button>).\u003c/li>\u003cli>\u003cstrong>A 60:\u003c/strong> rellena el registro final de \u003ca href=\"#estado\">Estado\u003c/a>. El contenido de 60 (Mount Hyjal, raids) va en otro documento.\u003c/li>\u003c/ul>","text":"Pasa por el túnel norte de Felwood. Hub: Everlook (/way Winterspring 61 38). Evita Darkwhisper Gorge y las zonas de dragones si vas solo. Lower Blackrock Spire (55-60): Blackcrow, que suelta Shadow Hunter Vosh'gajin, es la mejor arma a distancia antes de raid. Alternativa: Silithus (Cenarion Hold, /way Silithus 51 38). A 60: rellena el registro final de estado.md. El contenido de 60 (Mount Hyjal, raids) va en otro documento.","range":[56,60]}]},"talentos":{"title":"Talentos","intro":"\u003cp>En WoW Forever los talentos están rehechos respecto a la versión clásica. Hay 51 puntos en total: el primero a nivel 10 y luego uno por nivel. Con el perk de Legacy \u003cstrong>Talented\u003c/strong> se reciben antes (ver \u003ca href=\"#sistemas\">Sistemas Forever\u003c/a>).\u003c/p>","sections":[{"title":"Leveo: Beast Mastery 31 / Marksmanship 20 / Survival 0","titleHtml":"Leveo: Beast Mastery 31 / Marksmanship 20 / Survival 0","slug":"leveo-beast-mastery-31-marksmanship-20-survival-0","html":"\u003cp>Todas las guías (Method, Warcraft Tavern, wow.gg, LepreStore) coinciden: \u003cstrong>Beast Mastery\u003c/strong> es la mejor especialización para subir en solitario.\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nivel\u003c/th>\u003cth>Talento\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>10-14\u003c/td>\u003ctd>Deadly Aspects 5/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>15-16\u003c/td>\u003ctd>Focused Fire 2/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>17-18\u003c/td>\u003ctd>Endurance Training 2/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>19\u003c/td>\u003ctd>Improved Revive Pet 1/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Bestial Swiftness 1/1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>21-22\u003c/td>\u003ctd>Pathfinding 2/2 (en Forever está en la fila 3)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>23-24\u003c/td>\u003ctd>Unleashed Fury 2/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>25\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Summon Hawk 1/1\u003c/strong> (talento nuevo de Forever)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>26\u003c/td>\u003ctd>Unleashed Fury 3/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>27-29\u003c/td>\u003ctd>Ferocity 3/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>30\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Intimidation 1/1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>31-32\u003c/td>\u003ctd>Ferocity 5/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>33-34\u003c/td>\u003ctd>Bestial Discipline 2/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>35-39\u003c/td>\u003ctd>Frenzy 5/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>40\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Bestial Wrath 1/1\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>41-45\u003c/td>\u003ctd>Lethal Attacks 5/5 (Marksmanship)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>46-50\u003c/td>\u003ctd>Careful Aim 5/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>51-52\u003c/td>\u003ctd>Rapid Killing 2/2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>53-55\u003c/td>\u003ctd>Efficiency 3/5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>56\u003c/td>\u003ctd>Trueshot Aura 1/1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>57-60\u003c/td>\u003ctd>Mortal Shots 4/5\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Notas de uso:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Desde nivel 25\u003c/strong>, ten siempre fuera \u003cstrong>dos Summon Hawk además de tu mascota\u003c/strong>. Method lo considera &quot;muy importante&quot;. Vuelve a lanzar Summon Hawk solo justo antes de que se acabe, para ahorrar maná.\u003c/li>\u003cli>\u003cstrong>No cojas Lone Wolf\u003c/strong> mientras subes, porque te obliga a ir sin mascota.\u003c/li>\u003c/ul>","text":"Todas las guías (Method, Warcraft Tavern, wow.gg, LepreStore) coinciden: Beast Mastery es la mejor especialización para subir en solitario. Nivel Talento Deadly Aspects 5/5 Focused Fire 2/2 Endurance Training 2/5 Improved Revive Pet 1/2 Bestial Swiftness 1/1 Pathfinding 2/2 (en Forever está en la fila 3) Unleashed Fury 2/5 Summon Hawk 1/1 (talento nuevo de Forever) Unleashed Fury 3/5 Ferocity 3/5 Intimidation 1/1 Ferocity 5/5 Bestial Discipline 2/2 Frenzy 5/5 Bestial Wrath 1/1 Lethal Attacks 5/5 (Marksmanship) Careful Aim 5/5 Rapid Killing 2/2 Efficiency 3/5 Trueshot Aura 1/1 Mortal Shots 4/5 Notas de uso: Desde nivel 25, ten siempre fuera dos Summon Hawk además de tu mascota. Method lo considera \"muy importante\". Vuelve a lanzar Summon Hawk solo justo antes de que se acabe, para ahorrar maná. No cojas Lone Wolf mientras subes, porque te obliga a ir sin mascota.","range":null},{"title":"Nivel 40: doble especialización","titleHtml":"Nivel 40: doble especialización","slug":"nivel-40-doble-especializacion","html":"\u003cp>A nivel 40 el entrenador de clase vende la \u003cstrong>doble especialización\u003c/strong> (50 g según Warcraft Wiki). Cambiar entre las dos es gratis fuera de combate. \u003cstrong>Para el leveo no hace falta.\u003c/strong> Cómprala cuando te sobre oro después de la montura, o directamente a 60.\u003c/p>","text":"A nivel 40 el entrenador de clase vende la doble especialización (50 g según Warcraft Wiki). Cambiar entre las dos es gratis fuera de combate. Para el leveo no hace falta. Cómprala cuando te sobre oro después de la montura, o directamente a 60.","range":null},{"title":"Nivel 60 (de momento son builds teóricas, todavía no hay un meta probado)","titleHtml":"Nivel 60 (de momento son builds teóricas, todavía no hay un meta probado)","slug":"nivel-60-de-momento-son-builds-teoricas-todavia-no-hay-un-meta-probado","html":"\u003ch3 id=\"pvp\">PvP\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Beast Mastery PvP, 32/19/0:\u003c/strong>\u003cul>\u003cli>Beast Mastery: Bestial Wrath, Intimidation, Frenzy 5/5, Ferocity 5/5, Unleashed Fury 5/5 y Endurance Training 5/5.\u003c/li>\u003cli>Marksmanship: Hawk Eye 3/3, Improved Concussive Shot 5/5, Lethal Attacks 2/5, Careful Aim 5/5 y Mortal Shots 4/5.\u003c/li>\u003cli>Renuncia a Deadly Aspects y Summon Hawk a cambio de una mascota más resistente y de más control.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Marksmanship PvP, 0/31/20:\u003c/strong>\u003cul>\u003cli>Marksmanship: Hawk Eye, Improved Concussive Shot, Improved Stings, Careful Aim, Rapid Killing, Trueshot Aura, Mortal Shots, Barrage, Scatter Shot, parte de Ranged Weapon Specialization y Sniper Shot.\u003c/li>\u003cli>Survival: Deflection, Entrapment, Improved Wing Clip, Surefooted, Deterrence y Counterattack.\u003c/li>\u003cli>Se juega a distancia máxima: Frost Trap donde tenga que pasar el melee, Scatter Shot para reiniciar y Sniper Shot (4 s de lanzamiento) solo cuando tengas tiempo.\u003c/li>\u003c/ul>\u003c/li>\u003cli>En la versión clásica, el PvP a 60 se jugaba con Marksmanship. En Forever todavía no está claro cuál es mejor; revísalo cuando llegues a 60.\u003c/li>\u003c/ul>\n\u003ch3 id=\"pve\">PvE\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Beast Mastery 31/20/0:\u003c/strong> la misma build del leveo, pero con Endurance Training 3/5 y Unleashed Fury 5/5, y sin Pathfinding ni Improved Revive Pet.\u003c/li>\u003cli>\u003cstrong>Marksmanship 0/38/13:\u003c/strong> con Lone Wolf, sin mascota (+20 % de daño).\u003c/li>\u003c/ul>","text":"PvP Beast Mastery PvP, 32/19/0: Beast Mastery: Bestial Wrath, Intimidation, Frenzy 5/5, Ferocity 5/5, Unleashed Fury 5/5 y Endurance Training 5/5. Marksmanship: Hawk Eye 3/3, Improved Concussive Shot 5/5, Lethal Attacks 2/5, Careful Aim 5/5 y Mortal Shots 4/5. Renuncia a Deadly Aspects y Summon Hawk a cambio de una mascota más resistente y de más control. Marksmanship PvP, 0/31/20: Marksmanship: Hawk Eye, Improved Concussive Shot, Improved Stings, Careful Aim, Rapid Killing, Trueshot Aura, Mortal Shots, Barrage, Scatter Shot, parte de Ranged Weapon Specialization y Sniper Shot. Survival: Deflection, Entrapment, Improved Wing Clip, Surefooted, Deterrence y Counterattack. Se juega a distancia máxima: Frost Trap donde tenga que pasar el melee, Scatter Shot para reiniciar y Sniper Shot (4 s de lanzamiento) solo cuando tengas tiempo. En la versión clásica, el PvP a 60 se jugaba con Marksmanship. En Forever todavía no está claro cuál es mejor; revísalo cuando llegues a 60. PvE Beast Mastery 31/20/0: la misma build del leveo, pero con Endurance Training 3/5 y Unleashed Fury 5/5, y sin Pathfinding ni Improved Revive Pet. Marksmanship 0/38/13: con Lone Wolf, sin mascota (+20 % de daño).","range":null},{"title":"Fuentes","titleHtml":"Fuentes","slug":"fuentes","html":"\u003cul>\u003cli>Method: \u003ca class=\"ext\" href=\"https://www.method.gg/wow-forever/wow-forever-hunter-leveling-guide-and-talents\" target=\"_blank\" rel=\"noopener\">method.gg\u003c/a>\u003c/li>\u003cli>LepreStore BM: \u003ca class=\"ext\" href=\"https://leprestore.com/guides/world-of-warcraft-forever/wow-forever-beast-mastery-hunter-guide-best-builds-race-professions/\" target=\"_blank\" rel=\"noopener\">leprestore.com\u003c/a>\u003c/li>\u003cli>LepreStore MM: \u003ca class=\"ext\" href=\"https://leprestore.com/guides/world-of-warcraft-forever/wow-forever-marksmanship-hunter-guide-best-builds-race-professions/\" target=\"_blank\" rel=\"noopener\">leprestore.com\u003c/a>\u003c/li>\u003cli>Calculadora de talentos: \u003ca class=\"ext\" href=\"https://www.method.gg/wow-forever/talent-calculator\" target=\"_blank\" rel=\"noopener\">method.gg\u003c/a>\u003c/li>\u003c/ul>","text":"Method: https://www.method.gg/wow-forever/wow-forever-hunter-leveling-guide-and-talents LepreStore BM: https://leprestore.com/guides/world-of-warcraft-forever/wow-forever-beast-mastery-hunter-guide-best-builds-race-professions/ LepreStore MM: https://leprestore.com/guides/world-of-warcraft-forever/wow-forever-marksmanship-hunter-guide-best-builds-race-professions/ Calculadora de talentos: https://www.method.gg/wow-forever/talent-calculator","range":null}]},"hechizos":{"title":"Hechizos: qué entrenar en cada nivel","intro":"\u003cp>Entrenar todos los rangos de 1 a 60 cuesta unos \u003cstrong>206 g\u003c/strong> en Forever. Para tener oro para la montura del 40, entrena solo lo marcado como \u003cstrong>Sí\u003c/strong>. Lo marcado como \u003cstrong>Saltar\u003c/strong> no se compra durante el leveo.\u003c/p>\n\u003cp>En Forever los hechizos nuevos \u003cstrong>no se colocan solos en las barras de acción\u003c/strong>: arrástralos tú.\u003c/p>\n\u003cdiv class=\"tbl\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Nivel\u003c/th>\u003cth>Hechizo\u003c/th>\u003cth>¿Entrenar?\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>Auto Shot, Raptor Strike, Track Beasts\u003c/td>\u003ctd>Ya los tienes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>Serpent Sting, Aspect of the Monkey\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>Arcane Shot, Hunter's Mark\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Concussive Shot\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>Raptor Strike R2\u003c/td>\u003ctd>Saltar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10\u003c/td>\u003ctd>Aspect of the Hawk, Serpent Sting R2, Call Pet, Dismiss Pet, Feed Pet, Revive Pet, Track Humanoids\u003c/td>\u003ctd>Sí. Tame Beast y Beast Training vienen de la misión de clase\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>Mend Pet, Arcane Shot R2, Wing Clip\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>Distracting Shot\u003c/td>\u003ctd>Saltar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>14\u003c/td>\u003ctd>Eagle Eye, Eyes of the Beast, Scare Beast\u003c/td>\u003ctd>Saltar (Scare Beast solo para PvP)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>16\u003c/td>\u003ctd>Immolation Trap, Mongoose Bite, Raptor Strike R3\u003c/td>\u003ctd>Saltar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18\u003c/td>\u003ctd>\u003cstrong>Multi-Shot\u003c/strong>, Aspect of the Hawk R2, Serpent Sting R3\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18\u003c/td>\u003ctd>Track Undead\u003c/td>\u003ctd>Saltar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>\u003cstrong>Aimed Shot\u003c/strong>, Aspect of the Cheetah, Freezing Trap, Disengage, Arcane Shot R3, Mend Pet R2\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>20\u003c/td>\u003ctd>Distracting Shot R2\u003c/td>\u003ctd>Saltar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>22\u003c/td>\u003ctd>Hunter's Mark R2\u003c/td>\u003ctd>Sí\u003c/td>\u003c/tr>\u003ctr>\u003ctd>22\u003c/td>\u003ctd>Scorpid Sting\u003c/td>\u003ctd>Saltar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>24\u003c/td>\u003ctd>Track Hidden\u003c/td>\u003ctd>Sí (útil en PvP contra pícaros)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>24\u003c/td>\u003ctd>Beast Lore, Raptor Strike R4\u003c/td>\u003ctd>Saltar\u003c/td>\u
